[package]
name = "wc-app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WECOMMANDER app core shared by the native apps (via wecommander-core) and the Linux app: saved hosts, credentials in the OS keyring, SSH terminals, SFTP, tunnels"

[dependencies]
# Serial ports; no libudev so Linux builds need no extra system library.
tokio-serial = { version = "5.4", default-features = false }
# Mosh: AES-128-OCB packets, zlib instructions, a terminal state per frame.
ocb3 = "0.2"
aes = "0.9"
flate2 = "1"
vt100 = "0.18"
rand = "0.9"
wc-ssh-core = { path = "../wc-ssh-core" }
wc-vault = { path = "../wc-vault", features = ["os-keyring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.11"
argon2 = "0.6"
sha2 = "0.10"
getrandom = "0.3"
curve25519-dalek = { version = "5", default-features = false, features = ["zeroize"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
