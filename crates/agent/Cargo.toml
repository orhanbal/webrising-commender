[package]
name = "webrising-commender-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "webrising-commender"
path = "src/main.rs"

[features]
# Opt-in deterministic interprocess barriers for CI-only real MCP acceptance.
# Release artifacts must never enable this feature.
ci-race-fixtures = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
calamine = "=0.31.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
futures-util = "0.3"
hostname = "0.4"
hmac = "0.12"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
tokio = { version = "1.48", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
umya-spreadsheet = "=2.3.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zip = { version = "4.2", default-features = false, features = ["deflate"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
