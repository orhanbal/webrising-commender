name: platform-distribution
# The release gate (scripts/release-gate.mjs) links this run to the exact ci
# run by this suffix; GitHub lists workflow_run runs under the default-branch
# head at trigger time, not under the commit they build. Keep the format.
run-name: "platform-distribution for ${{ github.event.workflow_run.head_sha }} (ci ${{ github.event.workflow_run.id }}/${{ github.event.workflow_run.run_attempt }})"

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build verified Linux commit
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.event.workflow_run.run_number }}
        run: cargo build --release -p webrising-commender-agent
      - name: Package Linux Debian installer
        run: |
          VERSION="0.1.${{ github.event.workflow_run.run_number }}"
          bash scripts/build-ubuntu-deb.sh target/release/webrising-commender "$VERSION" dist
      - name: Retrieve passed Windows CI installer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p dist/ci-windows
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n WECOMMANDER-windows-x64-acceptance -D dist/ci-windows
          test -s dist/ci-windows/WECOMMANDER-Setup-windows-x64.exe
          cp dist/ci-windows/WECOMMANDER-Setup-windows-x64.exe dist/
          rm -rf dist/ci-windows
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n WECOMMANDER-Center-windows-x64 -D dist/ci-center
          test -s dist/ci-center/WECOMMANDER-Center-windows-x64.exe
          cp dist/ci-center/WECOMMANDER-Center-windows-x64.exe dist/
          rm -rf dist/ci-center
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n WECOMMANDER-Center-WinUI-windows-x64 -D dist/ci-winui
          test -s dist/ci-winui/WECOMMANDER-Center-windows-x64.zip
          cp dist/ci-winui/WECOMMANDER-Center-windows-x64.zip dist/
          rm -rf dist/ci-winui
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n WECOMMANDER-Center-linux-x86_64 -D dist/ci-center-linux
          test -s dist/ci-center-linux/WECOMMANDER-Center-linux-x86_64.tar.gz
          cp dist/ci-center-linux/WECOMMANDER-Center-linux-x86_64.tar.gz dist/
          rm -rf dist/ci-center-linux
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n WECOMMANDER-Desktop-Linux -D dist/ci-desktop-linux
          test -s dist/ci-desktop-linux/WECOMMANDER-Desktop-linux-amd64.deb
          cp dist/ci-desktop-linux/WECOMMANDER-Desktop-linux-amd64.deb dist/
          rm -rf dist/ci-desktop-linux
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n WECOMMANDER-Desktop-Windows -D dist/ci-desktop-windows
          test -s dist/ci-desktop-windows/WECOMMANDER-Desktop-windows-x64-setup.exe
          cp dist/ci-desktop-windows/WECOMMANDER-Desktop-windows-x64-setup.exe dist/
          rm -rf dist/ci-desktop-windows
      - name: Create shared integrity manifest
        run: |
          cd dist
          sha256sum -- *.deb *.exe *.zip *.tar.gz > SHA256SUMS.txt
      - name: Preserve verified installers and checksums as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-multiplatform-preview-${{ github.event.workflow_run.run_number }}
          path: |
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      # The repository integration may refuse release writes (HTTP 403) even
      # with contents:write. Keep CI-verified packages downloadable without
      # silently mislabeling the GitHub Release acceptance gate as passed.
      - name: Publish multi-platform preview release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ubuntu-preview-${{ github.event.workflow_run.run_number }}"
          gh release create "$TAG" dist/*.deb dist/*.exe dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "WECOMMANDER platform preview #${{ github.event.workflow_run.run_number }}" \
            --prerelease --notes "Preview installers: Ubuntu AMD64 Debian, Windows x64 Setup, Windows Management Center (native WinUI 3 .zip; Tauri tray .exe kept as fallback), Linux Management Center (.tar.gz), WECOMMANDER Desktop preview (SSH terminals; Linux .deb, Windows setup .exe, unsigned). The macOS PKG is published separately (macos-preview-*) only after the macOS workflow passes. Checksums available. Must pass physical-device acceptance before production approval."

      - name: Refresh the fixed center-linux-latest release used by the one-line installer
        if: ${{ steps.publish_release.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fixed tag lets "curl -fsSL https://wecommander.app/install/center.sh | sh"
          # download straight from GitHub's release CDN, without the releases API.
          TAG="center-linux-latest"
          mkdir -p latest
          cp dist/WECOMMANDER-Center-linux-x86_64.tar.gz latest/
          (cd latest && sha256sum -- WECOMMANDER-Center-linux-x86_64.tar.gz > SHA256SUMS.txt)
          NOTES="Newest WECOMMANDER Center for Linux (from ubuntu-preview-${{ github.event.workflow_run.run_number }}, ${{ github.event.workflow_run.head_sha }}). Replaced on every platform preview; used by the one-line installer."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" latest/WECOMMANDER-Center-linux-x86_64.tar.gz latest/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" latest/WECOMMANDER-Center-linux-x86_64.tar.gz latest/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "WECOMMANDER Center for Linux (latest preview)" \
              --prerelease --notes "$NOTES"
          fi

      - name: Report preview publication status
        if: ${{ always() }}
        env:
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          if [[ "$PUBLISH_OUTCOME" == "success" ]]; then
            echo "### PASSED — GitHub preview release published" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PUBLISH_OUTCOME" == "failure" ]]; then
            echo "### BLOCKED_EXTERNAL — GitHub Release permissions" >> "$GITHUB_STEP_SUMMARY"
            echo "CI-built Linux/Windows installers and SHA256SUMS.txt were preserved as an Actions artifact. Release creation was denied or unavailable. No production deployment or signing was attempted." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GitHub Release publish unavailable; archive artifact remains available (BLOCKED_EXTERNAL)"
          else
            echo "### PENDING — Preview release step was not executed" >> "$GITHUB_STEP_SUMMARY"
          fi
