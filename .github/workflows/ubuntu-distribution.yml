name: platform-distribution

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build verified Linux commit
        run: cargo build --release -p webrising-commender-agent
      - name: Package Linux Debian installer
        run: |
          VERSION="0.1.${{ github.event.workflow_run.run_number }}"
          bash scripts/build-ubuntu-deb.sh target/release/webrising-commender "$VERSION" dist
      - name: Retrieve passed Windows and macOS CI installers
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p dist/ci-windows dist/ci-macos
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n WECOMMANDER-windows-x64-acceptance -D dist/ci-windows
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n WECOMMANDER-macos-universal-acceptance -D dist/ci-macos
          test -s dist/ci-windows/WECOMMANDER-Setup-windows-x64.exe
          test -s dist/ci-macos/WECOMMANDER-macos-universal.pkg
          cp dist/ci-windows/WECOMMANDER-Setup-windows-x64.exe dist/
          cp dist/ci-macos/WECOMMANDER-macos-universal.pkg dist/
          rm -rf dist/ci-windows dist/ci-macos
      - name: Create shared integrity manifest
        run: |
          cd dist
          sha256sum -- *.deb *.exe *.pkg > SHA256SUMS.txt
      - name: Publish multi-platform preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ubuntu-preview-${{ github.event.workflow_run.run_number }}"
          gh release create "$TAG" dist/*.deb dist/*.exe dist/*.pkg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "WECOMMANDER platform preview #${{ github.event.workflow_run.run_number }}" \
            --prerelease --notes "Preview installers: Ubuntu AMD64 Debian, Windows x64 Setup, macOS universal PKG. Checksums available. Must pass physical-device acceptance before production approval."
