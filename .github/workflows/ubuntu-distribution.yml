name: ubuntu-distribution

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build verified commit's Linux binary
        run: cargo build --release -p webrising-commender-agent
      - name: Create installable Debian package
        run: |
          VERSION="0.1.${{ github.event.workflow_run.run_number }}"
          bash scripts/build-ubuntu-deb.sh target/release/webrising-commender "$VERSION" dist
          cd dist
          sha256sum -- *amd64.deb > SHA256SUMS.txt
      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ubuntu-preview-${{ github.event.workflow_run.run_number }}"
          gh release create "$TAG" dist/*.deb dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "WECOMMANDER Ubuntu preview #${{ github.event.workflow_run.run_number }}" \
            --prerelease --notes "Preview: single-command Ubuntu x86_64 installation, browser account approval and restricted systemd agent. Verify on a real server before production acceptance."
