name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: webrising-commender-linux-x64
            binary: target/release/webrising-commender
            suffix: ""
          - os: windows-latest
            artifact: webrising-commender-windows-x64
            binary: target/release/webrising-commender.exe
            suffix: ".exe"
          - os: macos-latest
            artifact: webrising-commender-macos-arm64
            binary: target/release/webrising-commender
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p webrising-commender-agent
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.artifact }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes
