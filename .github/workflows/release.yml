name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: WECOMMANDER-linux-x64
            binary: target/x86_64-unknown-linux-gnu/release/webrising-commender
            output: WECOMMANDER-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: WECOMMANDER-windows-x64
            binary: target/x86_64-pc-windows-msvc/release/webrising-commender.exe
            output: WECOMMANDER-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p webrising-commender-agent --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows agent
        run: cargo build --release -p webrising-commender-agent
      - name: Package password-free Windows setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'target\release\webrising-commender.exe' 'dist\webrising-commender.exe'
          Copy-Item 'installer\windows\WECOMMANDER.iss' 'dist\WECOMMANDER.iss'
          foreach ($name in @('WECOMMANDER-Onboarding.ps1','Install-User-Agent.ps1','Run-User-Agent.ps1','Uninstall-User-Agent.ps1','Migrate-Legacy-Service.ps1')) {
            Copy-Item ("installer\windows\"+$name) ("dist\"+$name)
          }
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler missing.' }
          Push-Location dist
          try {
            & $compiler "/DAppVersion=${env:GITHUB_REF_NAME}" "WECOMMANDER.iss"
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed.' }
          } finally { Pop-Location }
          Copy-Item 'dist\output\WECOMMANDER-Setup-windows-x64.exe' 'dist\WECOMMANDER-Setup-windows-x64.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-windows-setup
          path: dist/WECOMMANDER-Setup-windows-x64.exe

  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build both macOS architectures
        run: |
          cargo build --release -p webrising-commender-agent --target x86_64-apple-darwin
          cargo build --release -p webrising-commender-agent --target aarch64-apple-darwin
      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create             target/x86_64-apple-darwin/release/webrising-commender             target/aarch64-apple-darwin/release/webrising-commender             -output dist/WECOMMANDER-macos-universal
          lipo -info dist/WECOMMANDER-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-macos-universal
          path: dist/*

  publish:
    needs: [agent, macos-universal, windows-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add installer helpers and checksums
        run: |
          cp scripts/install-linux.sh dist/
          cp scripts/uninstall-linux.sh dist/
          cp scripts/install-macos.sh dist/
          cp scripts/uninstall-macos.sh dist/
          cp docs/QUICKSTART.md dist/
          cp docs/WINDOWS_SETUP.md dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes
