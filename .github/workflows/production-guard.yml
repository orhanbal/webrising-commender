name: production-guard

# Detects production updates that did not go through promote-production
# (Issue #30). Re-runs the release gate in audit mode: the production head must
# carry a valid annotated production-release/* tag and still have exact-SHA
# green main CI and platform-distribution. Runs on every production/tag update
# (when the pushed commit contains this file) and daily from main, so removing
# this file in a rogue production commit does not silence it.
#
# On the daily schedule and on manual dispatch it also probes the public site
# from GitHub's network as an independent external client: HTTPS health, HSTS,
# landing, console, public config, unauthenticated WebSocket upgrade refused,
# and /health build.commit == the current production head. It is skipped on
# push events, where the deployment is still starting.

on:
  push:
    branches: [production]
    tags: ["production-release/**"]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-guard
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Audit production head against the release ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: audit
        run: node scripts/release-gate.mjs
      - name: Public acceptance probe (HTTPS, HSTS, WSS refusal, served build = production head)
        if: ${{ github.event_name != 'push' }}
        env:
          COMMANDER_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://wecommander.webrising.tr' }}
        run: |
          COMMANDER_EXPECTED_COMMIT="$(git ls-remote origin refs/heads/production | cut -f1)"
          test -n "$COMMANDER_EXPECTED_COMMIT"
          export COMMANDER_EXPECTED_COMMIT
          node scripts/accept-production.mjs
