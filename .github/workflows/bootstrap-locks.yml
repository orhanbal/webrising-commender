name: bootstrap-locks

# Verifies that lockfiles and Rust formatting are already normalized.
# This workflow previously committed and pushed fixes directly to `main`,
# which made a bot an unreviewed writer of the (then) production-tracked ref.
# It is now read-only (Issue #30): fix drift on your branch with the commands
# printed below and push the result for review.

on:
  pull_request:
    paths:
      - "gateway/package.json"
      - "gateway/package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/bootstrap-locks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Node lockfile matches package.json
        working-directory: gateway
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Cargo lockfile matches manifests
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Fail on drift
        shell: bash
        run: |
          if ! git diff --quiet; then
            git --no-pager diff --stat
            echo "::error::Lockfile drift. Run 'cd gateway && npm install --package-lock-only --ignore-scripts' and commit the result on your branch."
            exit 1
          fi
