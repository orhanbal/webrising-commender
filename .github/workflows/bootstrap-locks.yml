name: bootstrap-locks

on:
  push:
    branches: [main]
    paths:
      - "gateway/package.json"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/bootstrap-locks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate Node lockfile
        working-directory: gateway
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock gateway/package-lock.json crates
          git commit -m "chore: normalize lockfiles and rust formatting"
          git push origin HEAD:main
