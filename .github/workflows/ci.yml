name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every Windows installer and maintenance script
        shell: pwsh
        run: |
          $scripts = @(
            Get-ChildItem installer/windows -Filter '*.ps1' -File
            Get-ChildItem scripts -Filter '*-windows*.ps1' -File
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$parseErrors)
            if (@($parseErrors).Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($script.Name): $($_.Message)" }
              throw "PowerShell syntax is invalid: $($script.Name)"
            }
            Write-Host "Parsed $($script.Name)"
          }
      - name: Windows PowerShell 5.1 picks a real Windows Setup release (dry run)
        # A parse check missed that 5.1 returns the releases array as one
        # object; run the selection on the built-in shell against GitHub.
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows-online.ps1 -DryRun *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'would install ubuntu-preview-[0-9]+ from https://github.com/orhanbal/webrising-commender/releases/download/ubuntu-preview-[0-9]+/WECOMMANDER-Setup-windows-x64.exe') { throw 'Windows installer did not select a release' }
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p webrising-commender-agent
      - name: Native PTY master reader/writer pre-spawn acquisition
        run: cargo test -p webrising-commender-agent terminal::tests::pty_master_handles_are_available_before_child_spawn -- --nocapture
      - name: Native post-acquisition undo quota lock inode and hardlink race
        run: cargo test -p webrising-commender-agent undo_lock_rejects_post_acquire_ -- --nocapture
      - name: Native terminal history lock inode and hardlink race
        run: cargo test -p webrising-commender-agent terminal_history::tests::lock_rejects_post_acquire_ -- --nocapture
      - name: Native terminal snapshot inode and hardlink race (Unix FIFO safety)
        run: cargo test -p webrising-commender-agent terminal_history::tests::snapshot_open_rejects_ -- --nocapture
      - name: macOS terminal history symlinked parent and live directory swap
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent terminal_history::tests::unix_ -- --nocapture
      - name: Native undo snapshot publication collision and recovery
        run: cargo test -p webrising-commender-agent undo_publication_tests -- --nocapture
      - name: Native atomic create no-overwrite race
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent atomic_create_ -- --nocapture
      - name: Windows atomic create no-overwrite race
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_atomic_create_ -- --nocapture
      - name: Native unconditional replace identity race
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent atomic_replace_no_sha_ -- --nocapture
      - name: Windows unconditional replace identity race
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_atomic_replace_no_sha_ -- --nocapture
      - name: Native atomic staging leaf substitution and safe cleanup
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent atomic_staging_ -- --nocapture
      - name: Windows atomic staging leaf substitution and safe cleanup
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_atomic_staging_ -- --nocapture
      - name: macOS credential staging leaf replacement rejection
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent config_stage_leaf_replacement_cannot_publish_or_delete_untrusted_file -- --nocapture
      - name: macOS credential staging same-inode tamper rejection
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent config_stage_inplace_tamper_cannot_publish_credentials -- --nocapture
      - name: Windows credential staging leaf replacement rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_config_stage_leaf_replacement_cannot_publish_or_delete_untrusted_file -- --nocapture
      - name: Windows credential staging same-inode tamper rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_config_stage_inplace_tamper_cannot_publish_credentials -- --nocapture
      - name: Native unguarded digest growth and truncation race
        run: cargo test -p webrising-commender-agent atomic_digest_race_tests -- --nocapture
      - name: Windows process_exec suspended Job Object containment (2C)
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_exec_job_tests -- --nocapture
      - name: macOS setsid descendant tracking for process_exec (2C)
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent macos_descendant_tests -- --nocapture
      - name: Windows process tree termination confirmation (2C)
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent process_ops::tests::windows_process_kill_confirms_snapshot_exit -- --nocapture
      - name: Windows PTY Job Object owned descendant cleanup (2C)
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_job::tests -- --nocapture
      - name: Windows real PTY stop kills owned child (2C)
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent terminal::tests::windows_terminal_stop_kills_owned_ping_descendant -- --nocapture
      - name: Native cross-process PTY slot contention and crash recovery
        run: cargo test -p webrising-commender-agent live_slot_quota_survives_parallel_subprocesses_and_crash -- --nocapture
      - name: Windows live PTY quota ordinary-directory swap and recovery
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_live_slot_rejects_regular_directory_swap_and_recovers -- --nocapture
      - name: Windows terminal history junction rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_junction_ -- --nocapture
      - name: Windows undo snapshot junction rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_undo_junction_ -- --nocapture
      - name: Windows undo hardlink isolation
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent undo_hardlink -- --nocapture
      - name: Windows undo quota file identity ABA rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_quota_rejects_same_content_file_identity_swap -- --nocapture
      - name: Native undo retention pruning identity and age
        run: cargo test -p webrising-commender-agent retention_prune_ -- --nocapture
      - name: Native undo snapshot consumption identity guard
        run: cargo test -p webrising-commender-agent undo_consumption_ -- --nocapture
      - name: Native undo snapshot bounded-read identity and byte integrity
        run: cargo test -p webrising-commender-agent undo_read_ -- --nocapture
      - name: Windows undo handle-based unlink and hostile leaf-swap acceptance
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_undo_handle_unlink_ -- --nocapture
      - name: Unix undo quota intermediate ABA identity guard
        if: runner.os != 'Windows'
        run: cargo test -p webrising-commender-agent quota_rejects_intermediate_aba_even_when_path_metadata_matches -- --nocapture
      - name: Unix undo unlink pinned parent rejection
        if: runner.os != 'Windows'
        run: cargo test -p webrising-commender-agent undo_unlink_rejects_symlinked_parent_without_touching_outside_file -- --nocapture
      - name: Unix undo final leaf pinned-parent identity and digest
        if: runner.os != 'Windows'
        run: cargo test -p webrising-commender-agent unix_undo_unlink_ -- --nocapture
      - name: Windows config credential junction rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_config_junction_ -- --nocapture
      - name: Windows config credential hardlink rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_config_hardlink_ -- --nocapture
      - name: Windows direct file handle reparse rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_file_reparse_tests -- --nocapture

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Release notes (release-notes/notes.json) are valid and their copies up to date
        run: python3 ../scripts/gen-release-notes.py --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install and build shadcn React web
        run: |
          cd ui
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify dashboard in desktop and mobile Chrome
        run: node test/dashboard-visual.mjs
      - name: Verify new shadcn frontend rendering
        run: node test/modern-ui-visual.mjs
      - name: Upload dashboard browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-acceptance
          path: gateway/test-artifacts/*.png
          if-no-files-found: ignore
      - name: Validate operations scripts
        run: |
          bash -n ../scripts/backup-compose.sh
          bash -n ../scripts/restore-compose.sh
          bash -n ../scripts/test-postgres-restore.sh
          bash -n ../scripts/ci-postgres-restore.sh
          node --check ../scripts/soak-restart.mjs
          node --check ../scripts/soak-availability.mjs
          node --test ../scripts/soak-availability.test.mjs
          node --check ../scripts/release-gate.mjs
          node --check ../scripts/github-app-token.mjs
          node --check ../scripts/verify-release.mjs
          node --test ../scripts/release-gate.test.mjs ../scripts/release-tools.test.mjs ../scripts/release-workflows.test.mjs
          node --check ../scripts/accept-production.mjs

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: gateway
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      HOST: 127.0.0.1
      PORT: 8787
      DEPLOYMENT_MODE: saas
      MCP_OAUTH_ENABLED: true
      PUBLIC_SIGNUP_ENABLED: true
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      SMTP_SECURITY: none
      SMTP_HELO_NAME: commender-ci
      SMTP_FROM: WECOMMANDER <commender@example.test>
      PADDLE_WEBHOOK_SECRET: ci-test-secret-paddle-signatures-2026
      MAIL_OUTBOX_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MAIL_DELIVERY_INTERVAL_MS: 250
      MAIL_DELIVERY_BATCH: 20
      TRUST_EXPIRY_INTERVAL_MS: 500
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build shadcn React application
        run: |
          cd ui
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../public/modern
          cp -R dist/. ../public/modern/
      - name: Start local SMTP acceptance server
        run: |
          node test/fake-smtp.mjs > /tmp/commender-smtp-server.log 2>&1 &
          echo $! > /tmp/commender-smtp-server.pid
          for i in {1..20}; do
            if grep -q "fake smtp listening" /tmp/commender-smtp-server.log 2>/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/commender-smtp-server.log
          exit 1
      - name: Start gateway
        run: |
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: Verify repeat migrations do not lock live business tables
        run: node test/migration-idempotence.mjs
      - name: Run integration acceptance
        run: npm run integration
      - name: Run OAuth 2.1 PKCE / ChatGPT MCP acceptance
        run: node test/oauth-integration.mjs
      - name: Command allowlist REST rules and approval e-mail notification
        run: node test/command-allowlist-api.mjs
      - name: Agent liveness (ping, stale close, offline state)
        run: node test/agent-liveness.mjs
      - name: RBAC matrix over MCP (viewer vs operator, audited denials)
        run: node test/rbac-matrix-e2e.mjs
      - name: Scheduled tasks (REST contract, scheduler claim, agent runs, app claim/result)
        run: node test/scheduled-tasks-e2e.mjs
      - name: Remote MCP to SSH hosts through the app (Hybrid Access H3/H4, fake app connector)
        run: node test/ssh-connector-e2e.mjs
      - name: Verify backup restore in disposable CI database
        working-directory: .
        run: bash scripts/ci-postgres-restore.sh
      - name: Run production acceptance probe against local gateway
        working-directory: .
        env:
          COMMANDER_BASE_URL: http://127.0.0.1:8787
        run: node scripts/accept-production.mjs
      - name: Verify search recovery across a real Gateway crash/restart
        run: node test/search-restart-e2e.mjs
      - name: Print gateway and SMTP logs on failure
        if: failure()
        run: |
          cat /tmp/commender-gateway.log || true
          cat /tmp/commender-smtp-server.log || true
          cat /tmp/commender-smtp.jsonl || true

  agent-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      HOST: 127.0.0.1
      PORT: 8787
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - name: Build opt-in debug Agent with deterministic MCP race fixture
        run: cargo build -p webrising-commender-agent --features ci-race-fixtures
      - name: Start gateway
        working-directory: gateway
        run: |
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: Run real-agent E2E
        run: node gateway/test/agent-e2e.mjs
      - name: Local stdio MCP mode (no gateway)
        run: node gateway/test/local-stdio-e2e.mjs
      - name: Verify real Rust Agent and Gateway SIGKILL/restart checkpoint handoff
        run: node gateway/test/native-restart-e2e.mjs
      - name: Verify real Rust Agent match-bearing content recovery after restart
        run: node gateway/test/native-restart-e2e.mjs content
      - name: Reject changed saved content during real Agent restart recovery
        run: node gateway/test/native-restart-e2e.mjs content-tampered
      - name: Device-local capabilities (read-only / no-commands) with a real Agent
        run: node gateway/test/device-capabilities-e2e.mjs
      - name: Restart gateway with MCP OAuth enabled
        working-directory: gateway
        env:
          MCP_OAUTH_ENABLED: "true"
        run: |
          kill "$(cat /tmp/commender-gateway.pid)" 2>/dev/null || true
          pkill -f "node dist/index.js" || true
          for i in {1..20}; do curl -fsS http://127.0.0.1:8787/health/live >/dev/null 2>&1 || break; sleep 0.5; done
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: MCP client acceptance (OAuth operator AI, admin approver, real Rust Agent)
        working-directory: gateway
        run: node test/mcp-client-acceptance.mjs
      - name: Print gateway log on failure
        if: failure()
        run: cat /tmp/commender-gateway.log || true

  relay-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      DEPLOYMENT_MODE: self_hosted
      REGIONAL_RELAY_ENABLED: true
      RELAY_CLUSTER_SECRET: ci-relay-cluster-secret-0123456789-0123456789
      RELAY_REQUEST_TIMEOUT_MS: 35000
      HOST: 127.0.0.1
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      PORT: 8787
      CLUSTER_NODE_ID: control-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - run: cargo build -p webrising-commender-agent
      - name: Start control and relay nodes
        working-directory: gateway
        run: |
          node dist/index.js > /tmp/commender-control.log 2>&1 &
          echo $! > /tmp/commender-control.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health >/dev/null || {
            cat /tmp/commender-control.log
            exit 1
          }

          PUBLIC_BASE_URL=http://127.0.0.1:8788 \
          PORT=8788 \
          CLUSTER_NODE_ID=relay-a \
          RELAY_REGION=eu-west \
          RELAY_PUBLIC_WS_URL=ws://127.0.0.1:8788/agent \
          RELAY_INTERNAL_BASE_URL=http://127.0.0.1:8788 \
          RELAY_MAX_DEVICES=10 \
          node dist/index.js > /tmp/commender-relay-a.log 2>&1 &
          echo $! > /tmp/commender-relay-a.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8788/health >/dev/null || {
            cat /tmp/commender-relay-a.log
            exit 1
          }

          PUBLIC_BASE_URL=http://127.0.0.1:8789 \
          PORT=8789 \
          CLUSTER_NODE_ID=relay-b \
          RELAY_REGION=eu-central \
          RELAY_PUBLIC_WS_URL=ws://127.0.0.1:8789/agent \
          RELAY_INTERNAL_BASE_URL=http://127.0.0.1:8789 \
          RELAY_MAX_DEVICES=10 \
          node dist/index.js > /tmp/commender-relay-b.log 2>&1 &
          echo $! > /tmp/commender-relay-b.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8789/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8789/health >/dev/null || {
            cat /tmp/commender-relay-b.log
            exit 1
          }
      - name: Run regional relay failover E2E
        run: node gateway/test/relay-e2e.mjs
      - name: Print cluster logs on failure
        if: failure()
        run: |
          echo "=== control ==="
          cat /tmp/commender-control.log || true
          echo "=== relay-a ==="
          cat /tmp/commender-relay-a.log || true
          echo "=== relay-b ==="
          cat /tmp/commender-relay-b.log || true
      - name: Stop cluster
        if: always()
        run: |
          for pidfile in /tmp/commender-control.pid /tmp/commender-relay-a.pid /tmp/commender-relay-b.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

  tls-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - name: Generate ephemeral localhost certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout /tmp/commender-tls.key \
            -out /tmp/commender-tls.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 600 /tmp/commender-tls.key
      - name: Verify TLS config fails closed
        working-directory: gateway
        run: |
          if TLS_CERT_FILE=/tmp/commender-tls.crt \
             PUBLIC_BASE_URL=https://localhost:9443 \
             node dist/index.js >/tmp/tls-pairing-check.log 2>&1; then
            echo "gateway accepted TLS_CERT_FILE without TLS_KEY_FILE" >&2
            exit 1
          fi
          grep -q "TLS_CERT_FILE and TLS_KEY_FILE must be configured together" /tmp/tls-pairing-check.log

          if TLS_CERT_FILE=/tmp/commender-tls.crt \
             TLS_KEY_FILE=/tmp/commender-tls.key \
             PUBLIC_BASE_URL=http://localhost:9443 \
             node dist/index.js >/tmp/tls-base-url-check.log 2>&1; then
            echo "gateway accepted HTTP PUBLIC_BASE_URL with native TLS" >&2
            exit 1
          fi
          grep -q "PUBLIC_BASE_URL must use https:// when native TLS is enabled" /tmp/tls-base-url-check.log

          if PUBLIC_BASE_URL=https://localhost:9443/subpath              node dist/index.js >/tmp/public-origin-check.log 2>&1; then
            echo "gateway accepted PUBLIC_BASE_URL with a path" >&2
            exit 1
          fi
          grep -q "PUBLIC_BASE_URL must be an http(s) origin" /tmp/public-origin-check.log
      - name: Start native HTTPS gateway
        working-directory: gateway
        run: |
          HOST=127.0.0.1 \
          PORT=9443 \
          PUBLIC_BASE_URL=https://localhost:9443 \
          TLS_CERT_FILE=/tmp/commender-tls.crt \
          TLS_KEY_FILE=/tmp/commender-tls.key \
          TLS_MIN_VERSION=TLSv1.2 \
          node dist/index.js > /tmp/commender-tls-gateway.log 2>&1 &
          echo $! > /tmp/commender-tls-gateway.pid

          for i in {1..30}; do
            if curl --cacert /tmp/commender-tls.crt -fsS https://localhost:9443/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-tls-gateway.log
          exit 1
      - name: Run HTTPS and WSS acceptance
        env:
          TEST_TLS_BASE_URL: https://localhost:9443
          TEST_TLS_CA_FILE: /tmp/commender-tls.crt
        run: node gateway/test/tls-smoke.mjs
      - name: Print TLS gateway log on failure
        if: failure()
        run: cat /tmp/commender-tls-gateway.log || true
      - name: Stop TLS gateway
        if: always()
        run: |
          if [ -f /tmp/commender-tls-gateway.pid ]; then
            kill "$(cat /tmp/commender-tls-gateway.pid)" 2>/dev/null || true
          fi

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-postgres-password
      CONTROL_API_KEY: ci-compose-control-key-012345678901234567890
      APPROVAL_SIGNING_SECRET: ci-compose-approval-secret-0123456789012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose models
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.coolify.yml config --quiet
      - name: Start clean stack
        run: docker compose up -d --build --wait
      - name: Verify gateway health and console
        run: |
          curl -fsS http://127.0.0.1:8787/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8787/ | grep -q 'WECOMMANDER'
      - name: Verify backup and destructive restore
        run: |
          curl -fsS -X POST http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Backup Marker"}' >/dev/null

          rm -rf /tmp/commender-backups
          BACKUP_RETENTION_DAYS=0 bash scripts/backup-compose.sh /tmp/commender-backups
          archive="$(ls -1t /tmp/commender-backups/commender-*.dump | head -n1)"
          test -s "$archive"
          test -s "$archive.sha256"
          test -s "$archive.manifest"

          docker compose exec -T postgres psql -U commender -d commender -v ON_ERROR_STOP=1 \
            -c "delete from organizations where name='CI Backup Marker';" >/dev/null

          if curl -fsS http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" | grep -q 'CI Backup Marker'; then
            echo "marker deletion failed" >&2
            exit 1
          fi

          COMMANDER_RESTORE_CONFIRM=RESTORE bash scripts/restore-compose.sh "$archive"

          curl -fsS http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" | grep -q 'CI Backup Marker'
      - name: Inspect containers on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true
      - name: Stop clean stack
        if: always()
        run: docker compose down -v --remove-orphans

  installer-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install-linux.sh
          bash -n scripts/setup-ubuntu.sh
          bash -n scripts/build-ubuntu-deb.sh
          bash -n scripts/wecommander-setup-wrapper.sh
          bash -n scripts/install-ubuntu-online.sh
          bash -n scripts/setup-macos.sh
          bash -n scripts/build-macos-pkg.sh
          bash -n scripts/install-macos-online.sh
          bash scripts/setup-ubuntu.sh --help >/dev/null
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/uninstall-macos.sh
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-windows.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/uninstall-windows.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }


  plan-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: V2 plan schedule and document consistency
        run: |
          python3 plans/tools/wecommander_v2_scheduler.py validate
          python3 plans/tools/wecommander_v2_scheduler.py check
          python3 -m unittest discover -s plans/tools -p 'test_*.py' -v

  linux-acceptance-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release agent
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release -p webrising-commender-agent
      - name: Package Linux acceptance bundle
        run: |
          mkdir -p dist
          cp target/release/webrising-commender dist/webrising-commender
          bash scripts/build-ubuntu-deb.sh target/release/webrising-commender "0.1.${GITHUB_RUN_NUMBER}" dist
          dpkg-deb --field "dist/wecommander-agent_0.1.${GITHUB_RUN_NUMBER}_amd64.deb" Package Version Architecture
          sudo apt-get install -y "./dist/wecommander-agent_0.1.${GITHUB_RUN_NUMBER}_amd64.deb"
          sudo wecommander-setup --help >/dev/null
          test -x /opt/wecommander/bin/webrising-commender
          test -x /usr/bin/wecommander-setup
          cp scripts/install-linux.sh dist/
          cp scripts/uninstall-linux.sh dist/
          cp scripts/setup-ubuntu.sh dist/
          cp docs/UBUNTU_INSTALL.md dist/
          cp docs/QUICKSTART.md dist/
          cd dist
          sha256sum webrising-commender wecommander-agent_*.deb > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-linux-x64-acceptance
          path: dist/*
          retention-days: 14


  windows-acceptance-artifact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release agent
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release -p webrising-commender-agent
      - name: Package Windows acceptance bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\webrising-commender.exe" "dist\webrising-commender.exe" -Force
          Copy-Item "docs\QUICKSTART.md" "dist\QUICKSTART.md" -Force
          Get-FileHash "dist\webrising-commender.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  webrising-commender.exe" } |
            Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
      - name: Build Windows graphical setup
        shell: pwsh
        run: |
          Copy-Item "installer\windows\WECOMMANDER.iss" "dist\WECOMMANDER.iss"
          Copy-Item "installer\windows\WECOMMANDER-Onboarding.ps1" "dist\WECOMMANDER-Onboarding.ps1"
          Copy-Item "installer\windows\Install-User-Agent.ps1" "dist\Install-User-Agent.ps1"
          Copy-Item "installer\windows\Run-User-Agent.ps1" "dist\Run-User-Agent.ps1"
          Copy-Item "installer\windows\Uninstall-User-Agent.ps1" "dist\Uninstall-User-Agent.ps1"
          Copy-Item "installer\windows\Migrate-Legacy-Service.ps1" "dist\Migrate-Legacy-Service.ps1"
          foreach ($script in @("dist\WECOMMANDER-Onboarding.ps1", "dist\Install-User-Agent.ps1", "dist\Run-User-Agent.ps1", "dist\Uninstall-User-Agent.ps1", "dist\Migrate-Legacy-Service.ps1")) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$null,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler missing: $compiler" }
          Push-Location dist
          try {
            & $compiler "/DAppVersion=0.1.0" "WECOMMANDER.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          } finally { Pop-Location }
          Copy-Item "dist\output\WECOMMANDER-Setup-windows-x64.exe" "dist\WECOMMANDER-Setup-windows-x64.exe"
          Get-FileHash "dist\WECOMMANDER-Setup-windows-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  WECOMMANDER-Setup-windows-x64.exe" } |
            Add-Content -Encoding ascii "dist\SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-windows-x64-acceptance
          path: dist/*
          retention-days: 14

  desktop:
    # V2 desktop app (desktop/): Tauri 2 with User and Agent workspaces, built
    # on Linux and Windows here and on macOS in macos.yml (G1). Separate cargo
    # workspace, like tray/.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          bash scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev openssh-server gnome-keyring dbus-x11
          # The OpenSSH interop test starts its own sshd on 127.0.0.1.
          sudo mkdir -p /run/sshd
      - name: Shared crates (format, lint, tests)
        shell: bash
        run: |
          cargo fmt -p wc-ssh-core -p wc-vault -p wc-app-core -p wc-core-service -- --check
          cargo clippy --locked -p wc-ssh-core -p wc-vault -p wc-app-core -p wc-core-service --all-targets -- -D warnings
          cargo test --locked -p wc-ssh-core -p wc-vault -p wc-app-core -p wc-core-service
      - name: G1 keyring smoke test (Linux Secret Service)
        if: runner.os == 'Linux'
        run: |
          cat > /tmp/keyring-smoke.sh <<'SH'
          set -e
          echo -n ci-keyring-password | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          cargo test --locked -p wc-vault --features os-keyring --lib -- --ignored
          SH
          dbus-run-session -- bash /tmp/keyring-smoke.sh
      - name: G1 keyring smoke test (Windows Credential Manager)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked -p wc-vault --features os-keyring --lib -- --ignored
      - name: Terminal view copy and UI syntax
        shell: bash
        run: |
          cmp packages/terminal-ui/src/index.js desktop/ui/terminal-view.js
          node --check desktop/ui/app.js
          node --check desktop/ui/terminal-view.js
      - name: Desktop app (format, lint, tests, release build)
        working-directory: desktop
        shell: bash
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Desktop installer (A04, unsigned)
        working-directory: desktop
        shell: bash
        env:
          BUNDLES: ${{ runner.os == 'Linux' && 'deb' || 'nsis' }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          npx -y @tauri-apps/cli@2.12.4 build --ci --bundles "$BUNDLES" --config "{\"version\":\"$VERSION\"}"
          mkdir -p dist
          if [ "$BUNDLES" = deb ]; then
            cp target/release/bundle/deb/*.deb dist/WECOMMANDER-Desktop-linux-amd64.deb
          else
            cp target/release/bundle/nsis/*-setup.exe dist/WECOMMANDER-Desktop-windows-x64-setup.exe
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Desktop-${{ runner.os }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  center-windows:
    # Management Center (tray app). Separate cargo workspace in tray/.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --locked
      - name: Build release tray app
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\wecommander-center.exe" "dist\WECOMMANDER-Center-windows-x64.exe"
          $size = (Get-Item "dist\WECOMMANDER-Center-windows-x64.exe").Length
          if ($size -lt 1MB) { throw "tray app binary is unexpectedly small: $size bytes" }
      - name: Center installer dry run on Windows PowerShell 5.1
        shell: powershell
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install-center-windows-online.ps1'),[ref]$null,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          # Before the first release with the tray app there is nothing to pick;
          # the script must say so cleanly instead of failing to parse releases.
          # Its "not yet" error arrives on stderr; the step shell would stop on it.
          $ErrorActionPreference = 'Continue'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-center-windows-online.ps1 -DryRun -Tauri 2>&1 | Out-String
          $ErrorActionPreference = 'Stop'
          Write-Host $out
          if ($out -notmatch 'would install ubuntu-preview-[0-9]+ from https://github.com/orhanbal/webrising-commender/releases/download/ubuntu-preview-[0-9]+/WECOMMANDER-Center-windows-x64.exe' -and
              $out -notmatch 'No preview release with the Management Center yet') {
            throw 'center installer dry run did not resolve a release'
          }
          # The "not yet" answer exits 1 by design; the match above is the check.
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Center-windows-x64
          path: tray/dist/WECOMMANDER-Center-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  center-linux:
    # Management Center for Linux desktops: the Tauri tray app (tray/) with
    # freedesktop notifications that carry Onayla / Reddet actions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install WebKitGTK and tray libraries
        timeout-minutes: 30
        run: bash scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format, lint and unit tests
        working-directory: tray
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build release tray app
        working-directory: tray
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release --locked
      - name: Build the agent the app carries and runs itself
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release --locked -p webrising-commender-agent
      - name: Package
        run: bash scripts/build-center-linux.sh "0.1.${{ github.run_number }}" tray/dist
      - name: Install and start from the package (headless desktop session)
        run: |
          sudo apt-get install -y xvfb dbus-x11
          sh -n scripts/install-center-macos-online.sh
          cmp scripts/install-center-macos-online.sh gateway/public/install/center-macos.sh
          mkdir -p /tmp/center-home && tar -xzf tray/dist/WECOMMANDER-Center-linux-x86_64.tar.gz -C /tmp/center-home
          test -x /tmp/center-home/wecommander-center/wecommander-center
          /tmp/center-home/wecommander-center/webrising-commender --version | grep -q "0.1.${{ github.run_number }}$"
          grep -q '^Exec=wecommander-center$' /tmp/center-home/wecommander-center/wecommander-center.desktop
          # The app must start and keep running under a real X display and
          # session bus (tray, webview, notification plugin) for a few seconds.
          export HOME=/tmp/center-home
          dbus-run-session -- xvfb-run -a sh -c '/tmp/center-home/wecommander-center/wecommander-center --hidden & pid=$!; sleep 8; kill -0 $pid; kill $pid'
      - name: Center installer dry run on Linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$(sh scripts/install-center-macos-online.sh --dry-run 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -E "would install (center-linux-latest|ubuntu-preview-[0-9]+)|No preview release with the Management Center for this system yet"
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Center-linux-x86_64
          path: tray/dist/WECOMMANDER-Center-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  center-winui:
    # Management Center for Windows: native WinUI 3 app (center-windows/).
    runs-on: windows-latest
    env:
      # The window checks look controls up by their Turkish names; the
      # "languages" step below runs the app in other languages.
      WECOMMANDER_LANGUAGE: tr
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wecommander-core (shared Rust app core)
        run: cargo build --locked --release -p wc-core-service
      - name: Build the agent the app carries and runs itself
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --locked --release -p webrising-commender-agent
      - name: Icon outlines are up to date (Vuesax icons, scripts/gen-icons.py)
        run: python scripts/gen-icons.py --check
      - name: Core unit tests (CoreClient against the real wecommander-core)
        env:
          WECOMMANDER_CORE_BIN: ${{ github.workspace }}\target\release\wecommander-core.exe
        run: dotnet test center-windows/Core.Tests/WecommanderCenter.Core.Tests.csproj
      - name: Publish self-contained WinUI app
        run: |
          dotnet publish center-windows/App/WecommanderCenter.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o center-windows/publish
          Copy-Item target\release\wecommander-core.exe center-windows\publish\wecommander-core.exe
          Copy-Item target\release\webrising-commender.exe center-windows\publish\webrising-commender.exe
          # The app compares this build with the newest release for in-app updates.
          Set-Content -Path center-windows\publish\build.txt -Value "${{ github.run_number }}" -NoNewline -Encoding ascii
      - name: Smoke test (the main window opens; every section and + work)
        shell: powershell
        run: |
          # Smoke test: the main window opens and shows its sections (an empty
          # window got through once). UI Automation reads the real WinUI tree.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'smoke-localappdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $env:WECOMMANDER_DEBUG_LAYOUT = '1'
          $app = Start-Process -FilePath "center-windows\publish\WecommanderCenter.exe" -ArgumentList '--open-main' -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $found = @()
          for ($i = 0; $i -lt 40 -and $found.Count -lt 2; $i++) {
            Start-Sleep -Milliseconds 750
            $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children,
              (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)))
            foreach ($window in $windows) {
              $names = @('Sunucular', 'Yeni sunucu' | Where-Object {
                $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                  (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $_))) })
              if ($names.Count -gt $found.Count) { $found = $names }
            }
          }
          if ($found.Count -lt 2) {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            throw "Main window did not show its sections (found: $($found -join ', '))"
          }
          Write-Host "Main window shows: $($found -join ', ')"
          # A picture of the main window as it opened, to check the design.
          try {
            Add-Type -AssemblyName System.Drawing, System.Windows.Forms
            Start-Sleep -Seconds 2
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $g = [System.Drawing.Graphics]::FromImage($shot)
            $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            New-Item -ItemType Directory -Force -Path center-windows\screens | Out-Null
            $shot.Save((Join-Path (Resolve-Path center-windows\screens) 'main-window.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $shot.Dispose()
          } catch { Write-Host "screenshot failed: $_" }
          # Walk every section and press the terminal tab strip's "+": an error
          # there must never reach users (it once did).
          # Found AND drawn: a collapsed page still has its elements in the
          # automation tree, only off-screen with an empty rectangle.
          function Find-Visible($name) {
            $e = Find-ByName $name
            if (-not $e) { return $null }
            $r = $e.Current.BoundingRectangle
            if ($e.Current.IsOffscreen -or $r.IsEmpty -or $r.Width -le 0 -or $r.Height -le 0) { return $null }
            return $e
          }
          function Find-ByName($name) {
            $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children,
              (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)))
            foreach ($w in $windows) {
              $e = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)))
              if ($e) { return $e }
            }
            return $null
          }
          function Press($element) {
            $p = $null
            if ($element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$p)) { $p.Invoke(); return }
            if ($element.TryGetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern, [ref]$p)) { $p.Select(); return }
            throw "cannot press $($element.Current.Name)"
          }
          # Windows PowerShell reads this script as ANSI: Turkish letters are spelled as code points.
          $c = [char]0x00E7; $i = [char]0x0131; $u = [char]0x00FC; $s = [char]0x015F
          foreach ($section in @('Terminaller', 'Sunucular', 'Anahtarlar', 'Kimlikler', "Par${c}ac${i}klar", "T${u}neller", 'Bilinen sunucular', "Ge${c}mi${s}", 'Ayarlar', 'Terminaller', 'Sunucular', 'Terminaller')) {
            $item = Find-ByName $section
            if (-not $item) { throw "menu item missing: $section" }
            Press $item
            Start-Sleep -Milliseconds 900
            if ($app.HasExited) { throw "the app closed after opening $section" }
            # Diagnostics: is this section's own content drawn?
            $probe = @{ 'Terminaller' = "A${c}${i}k terminal yok"; 'Sunucular' = 'Yeni sunucu'; 'Anahtarlar' = 'Yeni anahtar' }[$section]
            if ($probe) {
              $e = Find-ByName $probe
              if ($e) { Write-Host ("{0}: '{1}' offscreen={2} rect={3}" -f $section, $probe, $e.Current.IsOffscreen, $e.Current.BoundingRectangle) }
              else { Write-Host ("{0}: '{1}' not in the tree" -f $section, $probe) }
            }
            if ($section -eq 'Sunucular' -and -not (Find-Visible 'Yeni sunucu')) {
              Start-Sleep -Milliseconds 800
              $layout = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\layout.log'
              if (Test-Path $layout) { Write-Host '--- layout.log ---'; Get-Content $layout | ForEach-Object { Write-Host $_ } } else { Write-Host 'no layout.log' }
              throw "Sunucular opened blank (its page is not on screen)"
            }
          }
          $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children,
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)))
          $add = $null
          foreach ($w in $windows) {
            $add = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
              (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'AddButton')))
            if ($add) { break }
          }
          if (-not $add) { throw "the terminal tab strip's + button is missing" }
          Press $add
          Start-Sleep -Milliseconds 1500
          if ($app.HasExited) { throw "the app closed after pressing +" }
          if (-not (Find-Visible 'Yeni sunucu')) { throw "+ did not open the server list (not on screen)" }
          $logs = @((Join-Path $env:LOCALAPPDATA 'WECOMMANDER\errors.log'),
                    (Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\errors.log'))
          foreach ($log in $logs) {
            if (Test-Path $log) { Get-Content $log; throw "the app logged an error while walking its sections" }
          }
          Write-Host "Every section opened; + opened the server list; no errors logged"
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process -Name 'wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # A terminal tab is laid out: its terminal view gets the page's size
          # (a tab once opened with an empty, zero-size terminal).
          Start-Sleep -Seconds 2
          $layout = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\layout.log'
          Remove-Item $layout -ErrorAction SilentlyContinue
          $env:WECOMMANDER_DEBUG_TAB = '1'
          $app = Start-Process -FilePath "center-windows\publish\WecommanderCenter.exe" -ArgumentList '--open-main' -PassThru
          $sized = $false
          for ($i = 0; $i -lt 40 -and -not $sized; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $layout) { $sized = [bool](Select-String -Path $layout -Pattern 'webview: size=([1-9][0-9]+)x([1-9][0-9]+)' -Quiet) }
          }
          if (Test-Path $layout) { Write-Host '--- layout.log ---'; Get-Content $layout | ForEach-Object { Write-Host $_ } } else { Write-Host 'no layout.log' }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process -Name 'wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $sized) { throw "a terminal tab opened with a zero-size terminal" }
          Write-Host "A terminal tab gets its full size"
      - name: Window check (panel beside the main window, reopen, server box, server management)
        shell: powershell
        run: |
          # The owner's reports: the panel window must open beside the main
          # window and come back when the app is opened again; the server box
          # sits at the bottom left; "Sunucu yonetimi" opens its window.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'dock-localappdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $env:WECOMMANDER_DEBUG_LAYOUT = '1'; $env:WECOMMANDER_DEBUG_DOCK = '1'; $env:WECOMMANDER_DEBUG_CHIP = '1'; $env:WECOMMANDER_DEBUG_TAB = '1'
          $exe = "center-windows\publish\WecommanderCenter.exe"
          # The app writes under the real profile folder (GetFolderPath ignores the variable).
          $layout = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\layout.log'
          Remove-Item $layout -ErrorAction SilentlyContinue
          # Win32 view of the windows: UI Automation lists an owned window under its owner, not at the top.
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Text;
          public static class Win {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr h, int a, out RECT r, int s);
            public static string List(uint pid) {
              var sb = new StringBuilder();
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) {
                  var t = new StringBuilder(256); GetWindowText(h, t, 256); RECT r; DwmGetWindowAttribute(h, 9, out r, 16);
                  sb.AppendLine(t + "|" + r.L + "," + r.T + "," + r.R + "," + r.B);
                }
                return true; }, IntPtr.Zero);
              return sb.ToString();
            }
          }
          "@
          function Visible($prefix) {
            foreach ($line in ([Win]::List([uint32]$app.Id) -split "`r?`n")) { if ($line -and $line.StartsWith($prefix)) { return $line } }
            return $null
          }
          $app = Start-Process -FilePath $exe -ArgumentList '--open-main' -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $o = [char]0x00F6
          function Windows-Of { $root.FindAll([System.Windows.Automation.TreeScope]::Children,
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id))) }
          function Top($prefix, [switch]$exact) {
            foreach ($w in (Windows-Of)) {
              $n = $w.Current.Name
              if (($exact -and $n -eq $prefix) -or (-not $exact -and $n.StartsWith($prefix))) { if (-not $w.Current.IsOffscreen) { return $w } }
            }
            return $null
          }
          function Report($when) {
            Write-Host "--- windows $when (visible, drawn bounds)"
            Write-Host ([Win]::List([uint32]$app.Id))
          }
          function WaitFor([scriptblock]$cond) { for ($i = 0; $i -lt 30; $i++) { if (& $cond) { return $true }; Start-Sleep -Milliseconds 500 }; return $false }
          $fail = @()
          $mainName = 'WECOMMANDER'; $panelName = 'WECOMMANDER Y'; $chipName = 'WECOMMANDER Sunucu kutusu'
          if (-not (WaitFor { Top $mainName -exact })) { $fail += 'main window did not open' }
          Start-Sleep -Seconds 2
          Report 'after start'
          $main = Top $mainName -exact
          $panelLine = Visible $panelName; $mainLine = Visible ($mainName + '|')
          if (-not $panelLine) { $fail += 'panel window not beside the main window at start' }
          elseif ($mainLine) {
            $m = ($mainLine -split '\|')[1] -split ','; $p = ($panelLine -split '\|')[1] -split ','
            $gap = [int]$p[0] - [int]$m[2]
            Write-Host "gap between the drawn windows: $gap px; tops $($m[1]) / $($p[1]); bottoms $($m[3]) / $($p[3])"
            if ([math]::Abs([int]$p[1] - [int]$m[1]) -gt 2 -or [math]::Abs([int]$p[3] - [int]$m[3]) -gt 2) { $fail += 'panel not aligned with the main window' }
          }
          # The live servers live in the Dock: no server box on the desktop and no
          # second icon next to the clock; the tray keeps only the Management Center.
          Start-Sleep -Seconds 3
          if (Top $chipName -exact) { $fail += 'the server box is still shown on the desktop' }
          # Close the main window (it hides to the tray): the panel goes with it.
          if ($main) {
            $wp = $null
            if ($main.TryGetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern, [ref]$wp)) { $wp.Close() }
            if (-not (WaitFor { -not (Top $mainName -exact) })) { $fail += 'main window did not close' }
            Start-Sleep -Seconds 1
            Report 'after closing the main window'
            if (Visible $panelName) { $fail += 'panel stayed on screen after the main window closed' }
          }
          # Open the app again (a second start is handed to the running one).
          Start-Process -FilePath $exe -ArgumentList '--open-main' | Out-Null
          if (-not (WaitFor { Top $mainName -exact })) { $fail += 'main window did not come back' }
          Start-Sleep -Seconds 2
          Report 'after opening again'
          if (-not (Visible $panelName)) { $fail += 'panel window did not come back beside the main window' }
          # Server management on the open terminal tab.
          $main = Top $mainName -exact
          if ($main) {
            $button = $main.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
              (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Sunucu y${o}netimi")))
            if (-not $button) {
              $terms = $main.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Terminaller')))
              if ($terms) { $sp = $null; if ($terms.TryGetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern, [ref]$sp)) { $sp.Select() }; Start-Sleep -Seconds 1 }
              $button = $main.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Sunucu y${o}netimi")))
            }
            if (-not $button) { $fail += 'Sunucu yonetimi button not found' }
            else {
              $ip = $null
              if ($button.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$ip)) { $ip.Invoke() }
              if (-not (WaitFor { Top "Sunucu y${o}netimi" })) { $fail += 'Sunucu yonetimi did not open its window' }
              Report 'after Sunucu yonetimi'
            }
          }
          if (Test-Path $layout) { Write-Host '--- layout.log ---'; Get-Content $layout | ForEach-Object { Write-Host $_ } }
          $errors = Join-Path $env:LOCALAPPDATA 'WECOMMANDER\errors.log'
          if (Test-Path $errors) { Write-Host '--- errors.log ---'; Get-Content $errors | ForEach-Object { Write-Host $_ }; $fail += 'the app logged an error' }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process -Name 'WecommanderCenter','wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($fail.Count -gt 0) { throw ("window check failed: " + ($fail -join '; ')) }
          Write-Host 'Panel beside the main window, back after reopening; server box bottom left; server management opens'
      - name: Languages (the app in English, German and French, screenshots)
        shell: powershell
        run: |
          # The interface follows WECOMMANDER_LANGUAGE (else the saved choice, else Windows).
          # Each language opens the main window; the window must show its sections in that language.
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms, UIAutomationClient, UIAutomationTypes
          $exe = (Resolve-Path "center-windows\publish\WecommanderCenter.exe").Path
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $fail = @()
          $expect = @{ en = 'Settings'; de = 'Einstellungen'; fr = 'Param' }
          foreach ($lang in 'en','de','fr') {
            Get-Process -Name 'WecommanderCenter' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            $env:WECOMMANDER_LANGUAGE = $lang
            $app = Start-Process -FilePath $exe -ArgumentList '--open-main' -PassThru
            $found = $false
            for ($i = 0; $i -lt 40 -and -not $found; $i++) {
              Start-Sleep -Milliseconds 500
              $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)
              foreach ($w in $root.FindAll([System.Windows.Automation.TreeScope]::Children, $cond)) {
                $all = $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
                foreach ($e in $all) { if ($e.Current.Name -and $e.Current.Name.StartsWith($expect[$lang])) { $found = $true; break } }
                if ($found) { break }
              }
            }
            Start-Sleep -Seconds 2
            try {
              $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
              New-Item -ItemType Directory -Force -Path center-windows\screens | Out-Null
              $bmp.Save((Join-Path (Resolve-Path center-windows\screens) "language-$lang.png"), [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "screenshot failed: $_" }
            if ($found) { Write-Host "PASS ${lang}: the main window shows '$($expect[$lang])...'" } else { $fail += "${lang}: '$($expect[$lang])' not found in the main window" }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name 'wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $env:WECOMMANDER_LANGUAGE = 'tr'
          if ($fail.Count -gt 0) { throw ("language check failed: " + ($fail -join '; ')) }
      - name: Task Manager (this computer's processes, guards, end a real child; window and screenshot)
        shell: powershell
        run: |
          # The reader and the guards on the real machine, no window: the app starts
          # a child (ping), finds it under itself, refuses lsass and itself, refuses a
          # PID whose start time does not match, then ends the child.
          $exe = (Resolve-Path "center-windows\publish\WecommanderCenter.exe").Path
          $log = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\taskmanager-selftest.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $test = Start-Process -FilePath $exe -ArgumentList '--task-manager-selftest' -PassThru -Wait
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } } else { Write-Host "no self-test log" }
          if ($test.ExitCode -ne 0) { throw "Task Manager self-test failed (exit $($test.ExitCode))" }
          # The window: it lists this app's own process with its PID column.
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms, UIAutomationClient, UIAutomationTypes
          Get-Process -Name 'WecommanderCenter' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          $app = Start-Process -FilePath $exe -ArgumentList '--open-task-manager' -PassThru
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $found = $false
          for ($i = 0; $i -lt 40 -and -not $found; $i++) {
            Start-Sleep -Milliseconds 500
            $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)
            foreach ($w in $root.FindAll([System.Windows.Automation.TreeScope]::Children, $cond)) {
              $names = $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name }
              if (($names -contains 'WecommanderCenter.exe') -and ($names -contains 'PID') -and ($names -contains "$($app.Id)")) { $found = $true; break }
            }
          }
          Start-Sleep -Seconds 3
          try {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            New-Item -ItemType Directory -Force -Path center-windows\screens | Out-Null
            $bmp.Save((Join-Path (Resolve-Path center-windows\screens) "task-manager.png"), [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
          } catch { Write-Host "screenshot failed: $_" }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $found) { throw "the Task Manager window did not list this app's own process" }
          # The Management Center icon is put next to the clock (Windows 11 hides new icons in ^).
          $icons = 'HKCU:\Control Panel\NotifyIconSettings'
          if (Test-Path $icons) {
            $ours = Get-ChildItem $icons | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.ExecutablePath -eq $exe }
            if (-not $ours) { Write-Host "notification icon not listed by this Windows yet" }
            elseif (@($ours | Where-Object { $_.IsPromoted -eq 1 }).Count -eq 0) { throw "the Management Center icon was left in the hidden overflow" }
            else { Write-Host "PASS the Management Center icon is shown next to the clock" }
          } else { Write-Host "no NotifyIconSettings on this Windows (icons are not hidden there)" }
          Write-Host "PASS the Task Manager window lists WecommanderCenter.exe with its PID $($app.Id)"
      - name: Task Scheduler (Zamanlayicilar - list, create, run, turn off and on, delete; guards)
        shell: powershell
        run: |
          # schtasks on the real machine, no window: the app lists the tasks, creates
          # \WECOMMANDER\wc-selftest (cmd /c exit 0, daily), finds it, runs it, turns it
          # off and on, edits it, refuses unsafe names and arguments, refuses to delete
          # a task outside \WECOMMANDER\, then deletes its own task.
          $exe = (Resolve-Path "center-windows\publish\WecommanderCenter.exe").Path
          $log = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\taskscheduler-selftest.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $test = Start-Process -FilePath $exe -ArgumentList '--task-scheduler-selftest' -PassThru -Wait
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } } else { Write-Host "no self-test log" }
          # Nothing is left behind (cmd keeps schtasks' "not found" off PowerShell's error stream).
          cmd /c "schtasks /query /tn \WECOMMANDER\wc-selftest >nul 2>&1"
          $left = ($LASTEXITCODE -eq 0)
          if ($left) { cmd /c "schtasks /delete /tn \WECOMMANDER\wc-selftest /f >nul 2>&1" }
          $global:LASTEXITCODE = 0
          if ($test.ExitCode -ne 0) { throw "Task Scheduler self-test failed (exit $($test.ExitCode))" }
          if ($left) { throw "the self-test task was left behind" }
          Write-Host "PASS the Task Scheduler self-test"
      - name: Dock check (AppBar edges, work area, Explorer restart, full screen, floating, move and reorder by drag, dock mode panels, auto-hide)
        shell: powershell
        run: |
          # Real window management on Windows: the Dock reserves its strip
          # through the shell (SHAppBarMessage), gives it back when it closes,
          # registers again after Explorer restarts, steps aside for full-screen
          # apps, floats and auto-hides. The numbers come from Windows itself.
          $exe = (Resolve-Path "center-windows\publish\WecommanderCenter.exe").Path
          $env:WECOMMANDER_DEBUG_LAYOUT = '1'; $env:WECOMMANDER_DEBUG_CHIP = '1'
          $local = [Environment]::GetFolderPath('LocalApplicationData')
          $settingsDir = Join-Path $local 'WECOMMANDER Center'
          $settingsFile = Join-Path $settingsDir 'settings.json'
          $layout = Join-Path $local 'WECOMMANDER\layout.log'
          $errors = Join-Path $local 'WECOMMANDER\errors.log'
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          Remove-Item $layout, $errors -ErrorAction SilentlyContinue
          Get-Process -Name 'WecommanderCenter' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Text;
          public static class D {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool SystemParametersInfo(int a, int b, ref RECT r, int c);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, IntPtr e);
            public static RECT Work() { var r = new RECT(); SystemParametersInfo(0x30, 0, ref r, 0); return r; }
            public static string Find(uint pid, string title) {
              string found = null;
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) {
                  var t = new StringBuilder(256); GetWindowText(h, t, 256);
                  if (t.ToString() == title) { RECT r; GetWindowRect(h, out r); found = r.L + "," + r.T + "," + r.R + "," + r.B; }
                }
                return true; }, IntPtr.Zero);
              return found;
            }
          }
          "@
          function Fmt($r) { "$($r.L),$($r.T),$($r.R),$($r.B)" }
          function Rect($s) { if (-not $s) { return $null }; $p = $s -split ','; return @{ L = [int]$p[0]; T = [int]$p[1]; R = [int]$p[2]; B = [int]$p[3] } }
          function WaitFor([scriptblock]$cond, $seconds = 15) { for ($i = 0; $i -lt $seconds * 4; $i++) { if (& $cond) { return $true }; Start-Sleep -Milliseconds 250 }; return $false }
          function Settings($json) { Set-Content -Path $settingsFile -Value $json -Encoding UTF8 }
          function Dock { if (-not $script:app) { return $null }; return Rect ([D]::Find([uint32]$script:app.Id, 'WECOMMANDER Dock')) }
          function Start-App { $script:app = Start-Process -FilePath $exe -ArgumentList '--hidden' -PassThru; if (-not (WaitFor { Dock } 25)) { $script:fail += "dock did not appear ($($script:case))" } ; Start-Sleep -Seconds 2 }
          function Quit-App {
            Start-Process -FilePath $exe -ArgumentList '--quit' | Out-Null
            if (-not (WaitFor { $script:app.HasExited } 20)) { $script:fail += "app did not quit ($($script:case))"; Stop-Process -Id $script:app.Id -Force -ErrorAction SilentlyContinue }
            Get-Process -Name 'wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          function Shot($name) {
            try {
              $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
              New-Item -ItemType Directory -Force -Path center-windows\screens | Out-Null
              $bmp.Save((Join-Path (Resolve-Path center-windows\screens) "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "screenshot failed: $_" }
          }
          $fail = @(); $passed = @()
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $base = [D]::Work()
          Write-Host "screen $($screen.Width)x$($screen.Height), work area without the Dock: $(Fmt $base)"
          $explorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue).Count -gt 0
          Write-Host "Explorer running: $explorer"

          # 1-2. Fixed on each edge: the strip is taken from the work area; --quit gives it back.
          foreach ($edge in 'top','bottom','left','right') {
            $script:case = "fixed $edge"
            Settings "{`"dock`":true,`"dockMode`":`"fixed`",`"dockEdge`":`"$edge`",`"deskChip`":true,`"watchChosen`":true}"
            Start-App
            $d = Dock; $w = [D]::Work()
            Write-Host "fixed ${edge}: dock $(if ($d) { "$($d.L),$($d.T),$($d.R),$($d.B)" } else { 'none' }), work area $(Fmt $w)"
            if ($d) {
              $ok = switch ($edge) {
                'top'    { $d.T -eq $base.T -and $w.T -eq $d.B -and $w.B -eq $base.B }
                'bottom' { $d.B -eq $base.B -and $w.B -eq $d.T -and $w.T -eq $base.T }
                'left'   { $d.L -eq $base.L -and $w.L -eq $d.R -and $w.R -eq $base.R }
                'right'  { $d.R -eq $base.R -and $w.R -eq $d.L -and $w.L -eq $base.L }
              }
              if ($ok) { $passed += "fixed $edge reserves its strip" } else { $fail += "fixed ${edge}: work area not reserved next to the Dock" }
              if ($edge -eq 'top') { Shot 'dock-top' }
              if ($edge -eq 'left') { Shot 'dock-left' }
            }
            if ($edge -eq 'top' -and $d) {
              # 5. The icon opens the quick panel just below a top Dock; its "Sunucularim" tile opens the server panel.
              Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $dl = [string][char]0x0131  # this script file is read as ANSI: no non-ASCII literals
              $iconName = 'WECOMMANDER: h' + $dl + 'zl' + $dl + ' panel'
              $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $iconName)
              $btn = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
              if (-not $btn) { $fail += 'Dock icon button not found' }
              else {
                $r = $btn.Current.BoundingRectangle
                [D]::SetCursorPos([int]($r.Left + $r.Width / 2), [int]($r.Top + $r.Height / 2)); [D]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 60; [D]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero)
                $quickTitle = 'WECOMMANDER h' + $dl + 'zl' + $dl + ' panel'
                if (WaitFor { [D]::Find([uint32]$app.Id, $quickTitle) } 8) {
                  $q = Rect ([D]::Find([uint32]$app.Id, $quickTitle))
                  Write-Host "quick panel from the Dock icon at $($q.L),$($q.T),$($q.R),$($q.B)"
                  if ($q.T -ge $d.B -and $q.T -le $d.B + 40 -and [math]::Abs($q.L - [int]$r.Left) -le 40) { $passed += 'icon opens the quick panel below the top Dock' } else { $fail += 'quick panel did not open just below the Dock icon' }
                  Shot 'dock-top-quick-panel'
                  $tileCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, ('Sunucular' + $dl + 'm'))
                  $tile = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $tileCond)
                  if (-not $tile) { $fail += 'quick panel: Sunucularim tile not found' }
                  else {
                    $t = $tile.Current.BoundingRectangle
                    $panelTitle = 'WECOMMANDER Sunucular' + $dl + 'm'
                    # A real click; on a slow runner the panel may still be animating in, so
                    # the click is tried again (then through UI Automation) before failing.
                    $opened = $false
                    for ($try = 0; $try -lt 3 -and -not $opened; $try++) {
                      if ($try -lt 2) { [D]::SetCursorPos([int]($t.Left + $t.Width / 2), [int]($t.Top + $t.Height / 2)); [D]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 60; [D]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero) }
                      else { try { $tile.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch { Write-Host "tile invoke failed: $_" } }
                      $opened = WaitFor { [D]::Find([uint32]$app.Id, $panelTitle) } 8
                      if (-not $opened) { Write-Host "Sunucularim tile: no server panel after try $($try + 1)" }
                    }
                    if ($opened) {
                      $p = Rect ([D]::Find([uint32]$app.Id, $panelTitle))
                      Write-Host "server panel from the quick panel at $($p.L),$($p.T),$($p.R),$($p.B)"
                      if ($p.T -ge $d.B -and $p.T -le $d.B + 40) { $passed += 'the quick panel opens the server panel below the top Dock' } else { $fail += 'server panel did not open just below the Dock' }
                      Shot 'dock-top-panel'
                    } else { $fail += 'the Sunucularim tile did not open the server panel' }
                  }
                  [D]::SetCursorPos([int]($screen.Width / 2), [int]($screen.Height / 2)); [D]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); [D]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero)
                  Start-Sleep -Seconds 1
                } else { $fail += 'clicking the Dock icon did not open the quick panel' }
              }
              # 8. Explorer restarts: the Dock registers again and keeps its strip.
              if ($explorer) {
                Stop-Process -Name explorer -Force
                Start-Sleep -Seconds 3
                if (-not (Get-Process -Name explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe }
                $again = WaitFor { (Get-Content $layout -Raw -ErrorAction SilentlyContinue) -match 'explorer restarted' } 30
                Start-Sleep -Seconds 4
                $d2 = Dock; $w2 = [D]::Work()
                Write-Host "after Explorer restart: dock $(if ($d2) { "$($d2.L),$($d2.T),$($d2.R),$($d2.B)" } else { 'none' }), work area $(Fmt $w2)"
                if ($again -and $d2 -and $w2.T -eq $d2.B) { $passed += 'Dock registers again after Explorer restarts' } else { $fail += "Dock not usable after Explorer restart (notice seen: $again)" }
              } else { Write-Host 'SKIP Explorer restart: Explorer is not running on this runner' }
              # 9. A full-screen app: the Dock steps aside and comes back.
              $fs = Start-Process powershell -PassThru -ArgumentList '-NoProfile','-Command','Add-Type -AssemblyName System.Windows.Forms; $f = New-Object System.Windows.Forms.Form; $f.FormBorderStyle = ''None''; $f.WindowState = ''Maximized''; $f.TopMost = $true; $f.BackColor = ''Black''; $f.Add_Shown({ $f.Activate() }); [System.Windows.Forms.Application]::Run($f)'
              $hidden = WaitFor { -not (Dock) } 10
              Shot 'dock-fullscreen'
              Stop-Process -Id $fs.Id -Force
              $back = WaitFor { Dock } 10
              Write-Host "full screen: Dock stepped aside $hidden, back $back"
              if ($hidden -and $back) { $passed += 'Dock steps aside for a full-screen app and comes back' } else { $fail += "full-screen handling (aside $hidden, back $back)" }
            }
            Quit-App
            $after = [D]::Work()
            if ((Fmt $after) -eq (Fmt $base)) { $passed += "work area back after the Dock closed ($edge)" } else { $fail += "work area not given back after quitting (fixed $edge): $(Fmt $after)" }
          }

          # 10b. The app is killed: does the reserved strip come back?
          $script:case = 'killed'
          Settings '{"dock":true,"dockMode":"fixed","dockEdge":"top","deskChip":true,"watchChosen":true}'
          Start-App
          Stop-Process -Id $app.Id -Force
          Get-Process -Name 'wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $restored = WaitFor { (Fmt ([D]::Work())) -eq (Fmt $base) } 15
          Write-Host "after the app was killed: work area $(Fmt ([D]::Work())), restored by Windows: $restored"
          if ($restored) { $passed += 'work area comes back when the app is killed' }
          else {
            # Next start with the Dock off must not leave it reserved either.
            Settings '{"dock":false,"deskChip":true,"watchChosen":true}'
            $script:app = Start-Process -FilePath $exe -ArgumentList '--hidden' -PassThru; Start-Sleep -Seconds 6; Quit-App
            $fail += "work area stays reserved after the app is killed (now $(Fmt ([D]::Work())))"
          }

          # 4. Floating: placed where it was left, no work area taken. Moving it like the taskbar: locked
          #    (the default) a drag does nothing; unlocked, a drag from the app icon to the top edge fixes it there.
          $dl = [string][char]0x0131  # this script file is read as ANSI: no non-ASCII literals
          $quickTitle = 'WECOMMANDER h' + $dl + 'zl' + $dl + ' panel'
          function Drag-Dock($d, $scale) {
            # Real mouse input on the app icon (not a module button), small steps first so the start of the drag is seen.
            $gx = $d.L + [int](27 * $scale); $gy = [int](($d.T + $d.B) / 2)
            [D]::SetCursorPos($gx, $gy); [D]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 150
            for ($i = 1; $i -le 24; $i++) {
              $tx = $gx + 2 * $i; $ty = $gy - [int](($gy - $base.T - 20 * $scale) * $i / 24)
              [D]::mouse_event(0x8001, [uint32]($tx * 65535 / ($screen.Width - 1)), [uint32]($ty * 65535 / ($screen.Height - 1)), 0, [IntPtr]::Zero)
              Start-Sleep -Milliseconds 40
            }
            Start-Sleep -Milliseconds 200
            [D]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero)
            Start-Sleep -Seconds 2
          }
          foreach ($locked in $true, $false) {
            $script:case = if ($locked) { 'floating locked' } else { 'floating unlocked' }
            $lockJson = if ($locked) { '' } else { ',"dockLocked":false' }
            Settings ('{"dock":true,"dockMode":"floating","dockEdge":"top","dockFloatX":200,"dockFloatY":300,"dockOnTop":true,"deskChip":true,"watchChosen":true' + $lockJson + '}')
            Start-App
            $d = Dock; $w = [D]::Work()
            Write-Host "$($script:case): dock $(if ($d) { "$($d.L),$($d.T),$($d.R),$($d.B)" } else { 'none' }), work area $(Fmt $w)"
            if (-not $d) { Quit-App; continue }
            $scale = [math]::Round(($d.B - $d.T) / 60.0, 2)
            if ([math]::Abs($d.L - ($base.L + 200 * $scale)) -le 3 -and [math]::Abs($d.T - ($base.T + 300 * $scale)) -le 3 -and (Fmt $w) -eq (Fmt $base)) { $passed += "floating Dock restored at its saved place, no work area taken ($($script:case))" } else { $fail += "floating Dock not at its saved place (or took work area) ($($script:case))" }
            if (-not $locked) { Shot 'dock-floating' }
            Drag-Dock $d $scale
            $moved = Dock
            $saved = Get-Content $settingsFile -Raw | ConvertFrom-Json
            $log = Get-Content $layout -Raw -ErrorAction SilentlyContinue
            Write-Host "$($script:case) after the drag: dock $(if ($moved) { "$($moved.L),$($moved.T),$($moved.R),$($moved.B)" } else { 'none' }), work area $(Fmt ([D]::Work())); saved mode=$($saved.dockMode) edge=$($saved.dockEdge) locked=$($saved.dockLocked)"
            if ([D]::Find([uint32]$app.Id, $quickTitle)) { $fail += "$($script:case): the drag clicked the app icon (start panel opened)" }
            if ($locked) {
              if ($moved -and [math]::Abs($moved.L - $d.L) -le 3 -and [math]::Abs($moved.T - $d.T) -le 3 -and $saved.dockMode -eq 'floating' -and $log -notmatch 'move started') { $passed += 'a locked Dock does not move when dragged' } else { $fail += 'the locked Dock moved (or changed its mode) when dragged' }
            } else {
              $fixed = WaitFor { $m = Dock; $m -and $m.T -eq $base.T -and ([D]::Work()).T -eq $m.B } 8
              $moved = Dock
              Write-Host "unlocked drag: dock $(if ($moved) { "$($moved.L),$($moved.T),$($moved.R),$($moved.B)" } else { 'none' }), work area $(Fmt ([D]::Work()))"
              if ($saved.dockMode -eq 'fixed' -and $saved.dockEdge -eq 'top' -and $log -match 'dropped at edge Top' -and $fixed) { $passed += 'dragged to the top edge, the unlocked Dock is fixed there and reserves its strip' } else { $fail += "unlocked drag to the top edge (mode $($saved.dockMode), edge $($saved.dockEdge), log $($log -match 'dropped at edge Top'), reserved $fixed)" }
              Shot 'dock-dragged-to-top'
            }
            Quit-App
            $after = [D]::Work()
            if ((Fmt $after) -ne (Fmt $base)) { $fail += "work area not given back after quitting ($($script:case)): $(Fmt $after)" }
          }

          # 6. Reorder on the Dock itself: a real mouse drag of the approvals button onto the terminal button
          #    (a row on top, a column on the left) saves the new order and keeps the others in place.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          foreach ($edge in 'top','left') {
            $script:case = "reorder $edge"
            Settings "{`"dock`":true,`"dockMode`":`"fixed`",`"dockEdge`":`"$edge`",`"dockLocked`":false,`"deskChip`":true,`"watchChosen`":true}"
            Start-App
            $uiRoot = [System.Windows.Automation.AutomationElement]::RootElement
            $dockCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'WECOMMANDER Dock')
            $dockEl = $uiRoot.FindFirst([System.Windows.Automation.TreeScope]::Children, $dockCond)
            $scope = if ($dockEl) { $dockEl } else { $uiRoot }
            $fromEl = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Bekleyen onaylar')))
            $toEl = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Terminal')))
            if (-not $fromEl -or -not $toEl) { $fail += "reorder ${edge}: approvals or terminal button not found on the Dock" }
            else {
              $a = $fromEl.Current.BoundingRectangle; $b = $toEl.Current.BoundingRectangle
              $sx = [int]($a.Left + $a.Width / 2); $sy = [int]($a.Top + $a.Height / 2)
              # The drop point: just inside the terminal button, before its middle.
              if ($edge -eq 'top') { $tx = [int]($b.Left + 4); $ty = $sy } else { $tx = $sx; $ty = [int]($b.Top + 4) }
              Write-Host "reorder ${edge}: drag approvals from $sx,$sy to $tx,$ty (terminal at $([int]$b.Left),$([int]$b.Top))"
              [D]::SetCursorPos($sx, $sy); [D]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 150
              for ($i = 1; $i -le 20; $i++) {
                $mx = $sx + [int](($tx - $sx) * $i / 20); $my = $sy + [int](($ty - $sy) * $i / 20)
                [D]::mouse_event(0x8001, [uint32]($mx * 65535 / ($screen.Width - 1)), [uint32]($my * 65535 / ($screen.Height - 1)), 0, [IntPtr]::Zero)
                Start-Sleep -Milliseconds 40
              }
              Start-Sleep -Milliseconds 200
              if ($edge -eq 'top') { Shot 'dock-reorder-dragging' }
              [D]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero)
              $want = 'servers,processes,tasks,approvals,terminal'
              $script:order = ''
              $saved = WaitFor { try { $script:order = (@((Get-Content $settingsFile -Raw | ConvertFrom-Json).dockModules) -join ','); $script:order -eq $want } catch { $false } } 8
              Write-Host "reorder ${edge}: saved order '$($script:order)'"
              if ($saved) { $passed += "dragging a module button on the $edge Dock saves the new order" } else { $fail += "reorder ${edge}: saved order '$($script:order)', expected '$want'" }
              Start-Sleep -Seconds 1
              # Built again in the new order: approvals now comes before terminal along the Dock.
              # The rebuilt Dock is looked up again (the old UI Automation element is stale), retrying briefly.
              $fromEl = $null; $toEl = $null
              for ($r = 0; $r -lt 10 -and -not ($fromEl -and $toEl); $r++) {
                $dockEl = $uiRoot.FindFirst([System.Windows.Automation.TreeScope]::Children, $dockCond)
                $scope = if ($dockEl) { $dockEl } else { $uiRoot }
                $fromEl = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Bekleyen onaylar')))
                $toEl = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Terminal')))
                if (-not ($fromEl -and $toEl)) { Start-Sleep -Milliseconds 500 }
              }
              $fromEl = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Bekleyen onaylar')))
              $toEl = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Terminal')))
              if ($fromEl -and $toEl) {
                $a = $fromEl.Current.BoundingRectangle; $b = $toEl.Current.BoundingRectangle
                $before = if ($edge -eq 'top') { $a.Left -lt $b.Left } else { $a.Top -lt $b.Top }
                if ($before) { $passed += "the $edge Dock shows the new order" } else { $fail += "reorder ${edge}: the Dock was not rebuilt in the new order" }
              } else { $fail += "reorder ${edge}: buttons missing after the drop" }
              if ($edge -eq 'top') { Shot 'dock-reorder-dropped' }
            }
            Quit-App
          }

          # 7. App mode. Dock mode: the Dock's Task Manager button opens a drop-down panel
          #    just below a top Dock (no window), Esc closes it. Classic mode: no Dock at all
          #    and no work area taken (the app works in its windows).
          $ou = [string][char]0x00F6  # this script file is read as ANSI: no non-ASCII literals
          $tmName = 'G' + $ou + 'rev Y' + $ou + 'neticisi'
          $tmPanelTitle = 'WECOMMANDER ' + $tmName
          $script:case = 'app mode dock'
          Settings '{"dock":true,"dockMode":"fixed","dockEdge":"top","appMode":"dock","deskChip":true,"watchChosen":true}'
          Start-App
          $d = Dock
          $uiRoot = [System.Windows.Automation.AutomationElement]::RootElement
          $dockCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'WECOMMANDER Dock')
          $dockEl = $uiRoot.FindFirst([System.Windows.Automation.TreeScope]::Children, $dockCond)
          $scope = if ($dockEl) { $dockEl } else { $uiRoot }
          $tmEl = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $tmName)))
          if (-not $d -or -not $tmEl) { $fail += 'app mode dock: the Task Manager button was not found on the Dock' }
          else {
            $r = $tmEl.Current.BoundingRectangle
            [D]::SetCursorPos([int]($r.Left + $r.Width / 2), [int]($r.Top + $r.Height / 2)); [D]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 60; [D]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero)
            if (WaitFor { [D]::Find([uint32]$app.Id, $tmPanelTitle) } 8) {
              $p = Rect ([D]::Find([uint32]$app.Id, $tmPanelTitle))
              Write-Host "dock mode: Task Manager panel at $($p.L),$($p.T),$($p.R),$($p.B) (button at $([int]$r.Left)..$([int]$r.Right))"
              # Below the Dock, over the button (kept inside the work area, so its left edge may be further left).
              if ($p.T -ge $d.B -and $p.T -le $d.B + 40 -and $p.L -le [int]$r.Right -and $p.R -ge [int]$r.Left) { $passed += 'dock mode: the Task Manager button opens its panel just below the top Dock' } else { $fail += 'dock mode: the Task Manager panel did not open just below its Dock button' }
              if ([D]::Find([uint32]$app.Id, $tmName)) { $fail += 'dock mode: the Task Manager window opened as well as the panel' }
              Shot 'dock-mode-task-manager-panel'
              Start-Sleep -Milliseconds 900
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              if (WaitFor { -not [D]::Find([uint32]$app.Id, $tmPanelTitle) } 5) { $passed += 'dock mode: Esc closes the panel' } else { $fail += 'dock mode: Esc did not close the Task Manager panel' }
            } else { $fail += 'dock mode: clicking the Task Manager button did not open its panel' }
            # The Terminal panel holds terminals in tabs: it opens with one tab, "+" adds another.
            $termEl = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Terminal')))
            if (-not $termEl) { $fail += 'dock mode: the Terminal button was not found on the Dock' }
            else {
              $r = $termEl.Current.BoundingRectangle
              [D]::SetCursorPos([int]($r.Left + $r.Width / 2), [int]($r.Top + $r.Height / 2)); [D]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 60; [D]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero)
              if (WaitFor { [D]::Find([uint32]$app.Id, 'WECOMMANDER Terminal') } 8) {
                Start-Sleep -Seconds 2
                $tabItem = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::TabItem)
                $panelEl = $uiRoot.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'WECOMMANDER Terminal')))
                if (-not $panelEl) { $fail += 'dock mode: the Terminal panel window was not found by name' }
                else {
                  $before = $panelEl.FindAll([System.Windows.Automation.TreeScope]::Descendants, $tabItem).Count
                  $buttons = $panelEl.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))
                  $add = $null; foreach ($b in $buttons) { if ($b.Current.AutomationId -eq 'AddButton' -or $b.Current.Name -match 'Add|Ekle') { $add = $b; break } }
                  Write-Host "terminal panel: $before tab(s), add button: $([bool]$add)"
                  if ($before -lt 1) { $fail += 'dock mode: the Terminal panel opened with no tab' }
                  elseif (-not $add) { $fail += 'dock mode: the Terminal panel has no + (new tab) button' }
                  else {
                    $add.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                    if (WaitFor { $panelEl.FindAll([System.Windows.Automation.TreeScope]::Descendants, $tabItem).Count -gt $before } 5) { $passed += 'dock mode: the Terminal panel opens tabs, + adds one' } else { $fail += 'dock mode: + did not add a terminal tab' }
                    Shot 'dock-mode-terminal-tabs'
                  }
                }
                [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              } else { $fail += 'dock mode: clicking the Terminal button did not open its panel' }
            }
          }
          Quit-App
          $script:case = 'app mode classic'
          Settings '{"dock":false,"appMode":"classic","deskChip":true,"watchChosen":true}'
          $script:app = Start-Process -FilePath $exe -ArgumentList '--hidden' -PassThru; Start-Sleep -Seconds 8
          if (-not $app.HasExited -and -not (Dock) -and (Fmt ([D]::Work())) -eq (Fmt $base)) { $passed += 'classic mode: no Dock and no work area taken' } else { $fail += 'classic mode: a Dock appeared (or the app exited, or work area was taken)' }
          Quit-App

          # 3. Auto-hide: out of sight until the mouse reaches the edge; no work area taken.
          $script:case = 'autohide'
          Settings '{"dock":true,"dockMode":"autohide","dockEdge":"top","dockShowDelay":100,"dockHideDelay":300,"deskChip":true,"watchChosen":true}'
          [D]::SetCursorPos([int]($screen.Width / 2), [int]($screen.Height / 2))
          Start-App
          $w = [D]::Work()
          $gone = WaitFor { $d = Dock; $d -and $d.B -le $base.T + 4 } 8
          $d = Dock
          Write-Host "auto-hide, mouse away: dock $($d.L),$($d.T),$($d.R),$($d.B)"
          [D]::SetCursorPos([int]($screen.Width / 2), $base.T)
          $out = WaitFor { $d = Dock; $d -and $d.T -eq $base.T } 6
          $d = Dock
          Write-Host "auto-hide, mouse at the edge: dock $($d.L),$($d.T),$($d.R),$($d.B)"
          Shot 'dock-autohide-shown'
          [D]::SetCursorPos([int]($screen.Width / 2), [int]($screen.Height / 2))
          $again = WaitFor { $d = Dock; $d -and $d.B -le $base.T + 4 } 6
          if ($gone -and $out -and $again -and (Fmt $w) -eq (Fmt $base)) { $passed += 'auto-hide slides out at the edge and back, no work area taken' } else { $fail += "auto-hide (hidden $gone, out $out, hidden again $again, work $(Fmt $w))" }
          Quit-App

          Write-Host '--- layout.log (dock) ---'
          if (Test-Path $layout) { Get-Content $layout | Where-Object { $_ -match 'dock|monitor panel|quick panel|desktop icons' } | ForEach-Object { Write-Host $_ } }
          if (Test-Path $errors) { Write-Host '--- errors.log ---'; Get-Content $errors | ForEach-Object { Write-Host $_ }; $fail += 'the app logged an error' }
          Remove-Item $settingsFile -ErrorAction SilentlyContinue
          Write-Host '--- PASS ---'; $passed | ForEach-Object { Write-Host "PASS $_" }
          if ($fail.Count -gt 0) { Write-Host '--- FAIL ---'; $fail | ForEach-Object { Write-Host "FAIL $_" }; throw ("dock check failed: " + ($fail -join '; ')) }
      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path "center-windows\publish\WecommanderCenter.exe")) { throw "WecommanderCenter.exe missing from publish output" }
          if (-not (Test-Path "center-windows\publish\wecommander-core.exe")) { throw "wecommander-core.exe missing from publish output" }
          if (-not (Test-Path "center-windows\publish\webrising-commender.exe")) { throw "embedded agent missing from publish output" }
          $agentVersion = (& "center-windows\publish\webrising-commender.exe" --version) -join ' '
          if ($agentVersion -notmatch "0\.1\.${{ github.run_number }}$") { throw "embedded agent has the wrong version: $agentVersion" }
          if ((Get-Content center-windows\publish\build.txt -Raw).Trim() -ne "${{ github.run_number }}") { throw "build.txt missing or wrong" }
          if (-not (Test-Path "center-windows\publish\Assets\terminal\index.html")) { throw "terminal surface missing from publish output" }
          foreach ($asset in @("icon.ico","icon.png","tray.ico","tray-pending.ico","tray-autonomy.ico","tray-autonomy-pending.ico","wordmark-dark-text.png","wordmark-light-text.png")) {
            if (-not (Test-Path "center-windows\publish\Assets\$asset")) { throw "asset missing: $asset" }
          }
          Compress-Archive -Path "center-windows\publish\*" -DestinationPath "center-windows\WECOMMANDER-Center-windows-x64.zip"
          $size = (Get-Item "center-windows\WECOMMANDER-Center-windows-x64.zip").Length
          Write-Host "zip size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 10MB) { throw "WinUI package is unexpectedly small: $size bytes" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WECOMMANDER-Center-windows-screens
          path: center-windows/screens
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Center-WinUI-windows-x64
          path: center-windows/WECOMMANDER-Center-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  center-windows-store:
    # Microsoft Store copy of the Windows app (MSIX, UnmadeThings.WECOMMANDER).
    # Unsigned: Partner Center signs what is uploaded there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wecommander-core and the agent the app carries
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --locked --release -p wc-core-service -p webrising-commender-agent
      - name: Build the Store package
        shell: pwsh
        run: |
          $payload = "center-windows\StorePayload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item target\release\wecommander-core.exe "$payload\wecommander-core.exe"
          Copy-Item target\release\webrising-commender.exe "$payload\webrising-commender.exe"
          Set-Content -Path "$payload\build.txt" -Value "${{ github.run_number }}" -NoNewline -Encoding ascii
          # Store versions: 1.0.<build>.0 (v1.0; the last part must be 0).
          $manifest = "center-windows\App\Package.appxmanifest"
          (Get-Content $manifest -Raw) -replace 'Version="0\.1\.0\.0"', 'Version="1.0.${{ github.run_number }}.0"' | Set-Content $manifest -Encoding utf8
          $out = Join-Path $PWD "center-windows\AppPackages\"
          dotnet publish center-windows/App/WecommanderCenter.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 `
            -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Never -p:AppxPackageDir=$out
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed" }
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
      - name: Check the package
        shell: pwsh
        run: |
          $msix = Get-ChildItem center-windows\AppPackages -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "no .msix produced" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $names = $zip.Entries | ForEach-Object { $_.FullName }
          $manifest = (New-Object System.IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())).ReadToEnd()
          $zip.Dispose()
          foreach ($f in @('WecommanderCenter.exe','wecommander-core.exe','webrising-commender.exe','build.txt','resources.pri','Assets/terminal/index.html','Assets/monitor/ghost.png','Assets/Store/Square44x44Logo.png')) {
            if ($names -notcontains $f) { throw "missing from the package: $f" }
          }
          if ($manifest -notmatch 'Name="UnmadeThings.WECOMMANDER"') { throw "wrong package name" }
          if ($manifest -notmatch 'Publisher="CN=60C5C646-086F-4B8B-BF4A-E5099CC37CA7"') { throw "wrong publisher" }
          if ($manifest -notmatch 'Version="1\.0\.${{ github.run_number }}\.0"') { throw "wrong version" }
          if ($manifest -notmatch 'windows.startupTask') { throw "startup task missing" }
          Write-Host "MSIX ok: $($msix.Name) $([math]::Round($msix.Length / 1MB, 1)) MB"
          # Partner Center takes the .msix as it is and signs it.
          New-Item -ItemType Directory -Force -Path store-dist | Out-Null
          Copy-Item $msix.FullName "store-dist\WECOMMANDER-Store-x64.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Store-x64
          path: store-dist/WECOMMANDER-Store-x64.msix
          if-no-files-found: error
          retention-days: 30

  windows-service-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native agent
        run: cargo build -p webrising-commender-agent
      - name: Install, start and remove Windows service
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramData "WebRisingCommenderCI"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $binary = Join-Path $dir "webrising-commender.exe"
          $config = Join-Path $dir "agent.json"
          Copy-Item "target\debug\webrising-commender.exe" $binary -Force

          $keyBytes = [byte[]](1..32 | ForEach-Object { 7 })
          $approvalKey = [Convert]::ToBase64String($keyBytes).TrimEnd("=").Replace("+","-").Replace("/","_")

          @{
            deviceId = "00000000-0000-0000-0000-000000000001"
            deviceToken = "ci-device-token"
            approvalKey = $approvalKey
            gatewayWsUrl = "ws://127.0.0.1:9/agent"
            controlUrl = "http://127.0.0.1:9"
            name = "CI Windows Service"
            allowedRoots = @($dir)
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $config

          try {
            .\scripts\install-windows.ps1 -BinaryPath $binary -ConfigPath $config -AllowLocalSystem
            Start-Sleep -Seconds 3
            $service = Get-Service -Name "WebRisingCommender"
            if ($service.Status -ne "Running") {
              throw "Expected service to be Running, got $($service.Status)"
            }
          }
          finally {
            .\scripts\uninstall-windows.ps1 -ServiceName "WebRisingCommender"
            Start-Sleep -Seconds 2
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          }
      - name: Register passwordless Windows user agent task
        shell: pwsh
        run: |
          # This tests registration and the least-privilege interactive principal.
          # CI runners might have no desktop login, so activation is validated
          # by real Windows acceptance rather than launching the hidden agent.
          $dir = Join-Path $env:TEMP 'WECOMMANDER-UserTask-CI'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $binary = Join-Path $dir 'webrising-commender.exe'
          $config = Join-Path $dir 'agent.json'
          Copy-Item 'target\debug\webrising-commender.exe' $binary -Force
          @{
            deviceId = '00000000-0000-0000-0000-000000000002'
            deviceToken = 'ci-device-token'
            approvalKey = 'BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc'
            gatewayWsUrl = 'ws://127.0.0.1:9/agent'
            controlUrl = 'http://127.0.0.1:9'
            name = 'CI user-mode task'
            allowedRoots = @($dir)
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $config
          try {
            .\installer\windows\Install-User-Agent.ps1 -BinaryPath $binary -ConfigPath $config -SkipStart
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
            $taskName = "WECOMMANDER-Agent-$($identity.User.Value)"
            $task = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
            if ($task.Principal.LogonType -ne 'Interactive' -or $task.Principal.RunLevel -ne 'Limited') {
              throw "Unexpected user-task principal: $($task.Principal.LogonType) / $($task.Principal.RunLevel)"
            }
            # Started through a headless console host (no Windows Terminal window).
          $launch = "$($task.Actions.Execute) $($task.Actions.Arguments)"
          if ($launch -notmatch 'powershell.exe' -or $launch -notmatch 'Run-User-Agent.ps1') { throw 'Agent launcher not configured.' }
          if ((Test-Path "$env:SystemRoot\System32\conhost.exe") -and ($task.Actions.Execute -notmatch 'conhost.exe' -or $task.Actions.Arguments -notmatch '--headless')) { throw 'Agent must start without a window (conhost --headless).' }
          } finally {
            .\installer\windows\Uninstall-User-Agent.ps1
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          }
