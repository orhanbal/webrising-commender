name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p webrising-commender-agent

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate operations scripts
        run: |
          bash -n ../scripts/backup-compose.sh
          bash -n ../scripts/restore-compose.sh
          node --check ../scripts/soak-restart.mjs

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: gateway
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      HOST: 127.0.0.1
      PORT: 8787
      DEPLOYMENT_MODE: saas
      CLUSTER_MODE: regional
      GATEWAY_NODE_ID: ci-node-a
      GATEWAY_REGION: ci-region-a
      GATEWAY_INTERNAL_URL: http://127.0.0.1:8787
      GATEWAY_PUBLIC_URL: http://127.0.0.1:8787
      CLUSTER_SHARED_SECRET: ci-cluster-secret-0123456789-0123456789
      CLUSTER_HEARTBEAT_SECONDS: 1
      CLUSTER_NODE_STALE_SECONDS: 4
      CLUSTER_INTERNAL_TIMEOUT_MS: 10000
      PUBLIC_SIGNUP_ENABLED: true
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      SMTP_SECURITY: none
      SMTP_HELO_NAME: commender-ci
      SMTP_FROM: WebRising Commender <commender@example.test>
      MAIL_OUTBOX_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MAIL_DELIVERY_INTERVAL_MS: 250
      MAIL_DELIVERY_BATCH: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start local SMTP acceptance server
        run: |
          node test/fake-smtp.mjs > /tmp/commender-smtp-server.log 2>&1 &
          echo $! > /tmp/commender-smtp-server.pid
          for i in {1..20}; do
            if grep -q "fake smtp listening" /tmp/commender-smtp-server.log 2>/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/commender-smtp-server.log
          exit 1
      - name: Start gateway
        run: |
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: Start second regional relay node
        run: |
          PORT=8788 \
          PUBLIC_BASE_URL=http://127.0.0.1:8788 \
          GATEWAY_NODE_ID=ci-node-b \
          GATEWAY_REGION=ci-region-b \
          GATEWAY_INTERNAL_URL=http://127.0.0.1:8788 \
          GATEWAY_PUBLIC_URL=http://127.0.0.1:8788 \
          PUBLIC_SIGNUP_ENABLED=false \
          SMTP_HOST= \
          node dist/index.js > /tmp/commender-gateway-b.log 2>&1 &
          echo $! > /tmp/commender-gateway-b.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway-b.log
          exit 1
      - name: Run integration acceptance
        run: npm run integration
      - name: Print gateway and SMTP logs on failure
        if: failure()
        run: |
          cat /tmp/commender-gateway.log || true
          cat /tmp/commender-gateway-b.log || true
          cat /tmp/commender-smtp-server.log || true
          cat /tmp/commender-smtp.jsonl || true

  agent-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      HOST: 127.0.0.1
      PORT: 8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - run: cargo build -p webrising-commender-agent
      - name: Start gateway
        working-directory: gateway
        run: |
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: Run real-agent E2E
        run: node gateway/test/agent-e2e.mjs
      - name: Print gateway log on failure
        if: failure()
        run: cat /tmp/commender-gateway.log || true

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-postgres-password
      CONTROL_API_KEY: ci-compose-control-key-012345678901234567890
      APPROVAL_SIGNING_SECRET: ci-compose-approval-secret-0123456789012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose model
        run: docker compose config --quiet
      - name: Start clean stack
        run: docker compose up -d --build --wait
      - name: Verify gateway health and console
        run: |
          curl -fsS http://127.0.0.1:8787/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8787/ | grep -q 'WebRising Commender'
      - name: Verify backup and destructive restore
        run: |
          curl -fsS -X POST http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Backup Marker"}' >/dev/null

          rm -rf /tmp/commender-backups
          BACKUP_RETENTION_DAYS=0 bash scripts/backup-compose.sh /tmp/commender-backups
          archive="$(ls -1t /tmp/commender-backups/commender-*.dump | head -n1)"
          test -s "$archive"
          test -s "$archive.sha256"
          test -s "$archive.manifest"

          docker compose exec -T postgres psql -U commender -d commender -v ON_ERROR_STOP=1 \
            -c "delete from organizations where name='CI Backup Marker';" >/dev/null

          if curl -fsS http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" | grep -q 'CI Backup Marker'; then
            echo "marker deletion failed" >&2
            exit 1
          fi

          COMMANDER_RESTORE_CONFIRM=RESTORE bash scripts/restore-compose.sh "$archive"

          curl -fsS http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" | grep -q 'CI Backup Marker'
      - name: Inspect containers on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true
      - name: Stop clean stack
        if: always()
        run: docker compose down -v --remove-orphans

  installer-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install-linux.sh
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/uninstall-macos.sh
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-windows.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/uninstall-windows.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }


  windows-service-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native agent
        run: cargo build -p webrising-commender-agent
      - name: Install, start and remove Windows service
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramData "WebRisingCommenderCI"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $binary = Join-Path $dir "webrising-commender.exe"
          $config = Join-Path $dir "agent.json"
          Copy-Item "target\debug\webrising-commender.exe" $binary -Force

          $keyBytes = [byte[]](1..32 | ForEach-Object { 7 })
          $approvalKey = [Convert]::ToBase64String($keyBytes).TrimEnd("=").Replace("+","-").Replace("/","_")

          @{
            deviceId = "00000000-0000-0000-0000-000000000001"
            deviceToken = "ci-device-token"
            approvalKey = $approvalKey
            gatewayWsUrl = "ws://127.0.0.1:9/agent"
            controlUrl = "http://127.0.0.1:9"
            name = "CI Windows Service"
            allowedRoots = @($dir)
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $config

          try {
            .\scripts\install-windows.ps1 -BinaryPath $binary -ConfigPath $config -AllowLocalSystem
            Start-Sleep -Seconds 3
            $service = Get-Service -Name "WebRisingCommender"
            if ($service.Status -ne "Running") {
              throw "Expected service to be Running, got $($service.Status)"
            }
          }
          finally {
            .\scripts\uninstall-windows.ps1 -ServiceName "WebRisingCommender"
            Start-Sleep -Seconds 2
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          }
