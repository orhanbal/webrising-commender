name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every Windows installer and maintenance script
        shell: pwsh
        run: |
          $scripts = @(
            Get-ChildItem installer/windows -Filter '*.ps1' -File
            Get-ChildItem scripts -Filter '*-windows*.ps1' -File
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$parseErrors)
            if (@($parseErrors).Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($script.Name): $($_.Message)" }
              throw "PowerShell syntax is invalid: $($script.Name)"
            }
            Write-Host "Parsed $($script.Name)"
          }
      - name: Windows PowerShell 5.1 picks a real Windows Setup release (dry run)
        # A parse check missed that 5.1 returns the releases array as one
        # object; run the selection on the built-in shell against GitHub.
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows-online.ps1 -DryRun *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'would install ubuntu-preview-[0-9]+ from https://github.com/orhanbal/webrising-commender/releases/download/ubuntu-preview-[0-9]+/WECOMMANDER-Setup-windows-x64.exe') { throw 'Windows installer did not select a release' }
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p webrising-commender-agent
      - name: Native PTY master reader/writer pre-spawn acquisition
        run: cargo test -p webrising-commender-agent terminal::tests::pty_master_handles_are_available_before_child_spawn -- --nocapture
      - name: Native post-acquisition undo quota lock inode and hardlink race
        run: cargo test -p webrising-commender-agent undo_lock_rejects_post_acquire_ -- --nocapture
      - name: Native terminal history lock inode and hardlink race
        run: cargo test -p webrising-commender-agent terminal_history::tests::lock_rejects_post_acquire_ -- --nocapture
      - name: Native terminal snapshot inode and hardlink race (Unix FIFO safety)
        run: cargo test -p webrising-commender-agent terminal_history::tests::snapshot_open_rejects_ -- --nocapture
      - name: macOS terminal history symlinked parent and live directory swap
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent terminal_history::tests::unix_ -- --nocapture
      - name: Native undo snapshot publication collision and recovery
        run: cargo test -p webrising-commender-agent undo_publication_tests -- --nocapture
      - name: Native atomic create no-overwrite race
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent atomic_create_ -- --nocapture
      - name: Windows atomic create no-overwrite race
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_atomic_create_ -- --nocapture
      - name: Native unconditional replace identity race
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent atomic_replace_no_sha_ -- --nocapture
      - name: Windows unconditional replace identity race
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_atomic_replace_no_sha_ -- --nocapture
      - name: Native atomic staging leaf substitution and safe cleanup
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent atomic_staging_ -- --nocapture
      - name: Windows atomic staging leaf substitution and safe cleanup
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_atomic_staging_ -- --nocapture
      - name: macOS credential staging leaf replacement rejection
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent config_stage_leaf_replacement_cannot_publish_or_delete_untrusted_file -- --nocapture
      - name: macOS credential staging same-inode tamper rejection
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent config_stage_inplace_tamper_cannot_publish_credentials -- --nocapture
      - name: Windows credential staging leaf replacement rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_config_stage_leaf_replacement_cannot_publish_or_delete_untrusted_file -- --nocapture
      - name: Windows credential staging same-inode tamper rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_config_stage_inplace_tamper_cannot_publish_credentials -- --nocapture
      - name: Native unguarded digest growth and truncation race
        run: cargo test -p webrising-commender-agent atomic_digest_race_tests -- --nocapture
      - name: Windows process_exec suspended Job Object containment (2C)
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_exec_job_tests -- --nocapture
      - name: macOS setsid descendant tracking for process_exec (2C)
        if: runner.os == 'macOS'
        run: cargo test -p webrising-commender-agent macos_descendant_tests -- --nocapture
      - name: Windows process tree termination confirmation (2C)
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent process_ops::tests::windows_process_kill_confirms_snapshot_exit -- --nocapture
      - name: Windows PTY Job Object owned descendant cleanup (2C)
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_job::tests -- --nocapture
      - name: Windows real PTY stop kills owned child (2C)
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent terminal::tests::windows_terminal_stop_kills_owned_ping_descendant -- --nocapture
      - name: Native cross-process PTY slot contention and crash recovery
        run: cargo test -p webrising-commender-agent live_slot_quota_survives_parallel_subprocesses_and_crash -- --nocapture
      - name: Windows live PTY quota ordinary-directory swap and recovery
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_live_slot_rejects_regular_directory_swap_and_recovers -- --nocapture
      - name: Windows terminal history junction rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_junction_ -- --nocapture
      - name: Windows undo snapshot junction rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_undo_junction_ -- --nocapture
      - name: Windows undo hardlink isolation
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent undo_hardlink -- --nocapture
      - name: Windows undo quota file identity ABA rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_quota_rejects_same_content_file_identity_swap -- --nocapture
      - name: Native undo retention pruning identity and age
        run: cargo test -p webrising-commender-agent retention_prune_ -- --nocapture
      - name: Native undo snapshot consumption identity guard
        run: cargo test -p webrising-commender-agent undo_consumption_ -- --nocapture
      - name: Native undo snapshot bounded-read identity and byte integrity
        run: cargo test -p webrising-commender-agent undo_read_ -- --nocapture
      - name: Windows undo handle-based unlink and hostile leaf-swap acceptance
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_undo_handle_unlink_ -- --nocapture
      - name: Unix undo quota intermediate ABA identity guard
        if: runner.os != 'Windows'
        run: cargo test -p webrising-commender-agent quota_rejects_intermediate_aba_even_when_path_metadata_matches -- --nocapture
      - name: Unix undo unlink pinned parent rejection
        if: runner.os != 'Windows'
        run: cargo test -p webrising-commender-agent undo_unlink_rejects_symlinked_parent_without_touching_outside_file -- --nocapture
      - name: Unix undo final leaf pinned-parent identity and digest
        if: runner.os != 'Windows'
        run: cargo test -p webrising-commender-agent unix_undo_unlink_ -- --nocapture
      - name: Windows config credential junction rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_config_junction_ -- --nocapture
      - name: Windows config credential hardlink rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_config_hardlink_ -- --nocapture
      - name: Windows direct file handle reparse rejection
        if: runner.os == 'Windows'
        run: cargo test -p webrising-commender-agent windows_file_reparse_tests -- --nocapture

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install and build shadcn React web
        run: |
          cd ui
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify dashboard in desktop and mobile Chrome
        run: node test/dashboard-visual.mjs
      - name: Verify new shadcn frontend rendering
        run: node test/modern-ui-visual.mjs
      - name: Upload dashboard browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-acceptance
          path: gateway/test-artifacts/*.png
          if-no-files-found: ignore
      - name: Validate operations scripts
        run: |
          bash -n ../scripts/backup-compose.sh
          bash -n ../scripts/restore-compose.sh
          bash -n ../scripts/test-postgres-restore.sh
          bash -n ../scripts/ci-postgres-restore.sh
          node --check ../scripts/soak-restart.mjs
          node --check ../scripts/soak-availability.mjs
          node --test ../scripts/soak-availability.test.mjs
          node --check ../scripts/release-gate.mjs
          node --check ../scripts/github-app-token.mjs
          node --check ../scripts/verify-release.mjs
          node --test ../scripts/release-gate.test.mjs ../scripts/release-tools.test.mjs ../scripts/release-workflows.test.mjs
          node --check ../scripts/accept-production.mjs

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: gateway
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      HOST: 127.0.0.1
      PORT: 8787
      DEPLOYMENT_MODE: saas
      MCP_OAUTH_ENABLED: true
      PUBLIC_SIGNUP_ENABLED: true
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      SMTP_SECURITY: none
      SMTP_HELO_NAME: commender-ci
      SMTP_FROM: WECOMMANDER <commender@example.test>
      PADDLE_WEBHOOK_SECRET: ci-test-secret-paddle-signatures-2026
      MAIL_OUTBOX_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MAIL_DELIVERY_INTERVAL_MS: 250
      MAIL_DELIVERY_BATCH: 20
      TRUST_EXPIRY_INTERVAL_MS: 500
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build shadcn React application
        run: |
          cd ui
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../public/modern
          cp -R dist/. ../public/modern/
      - name: Start local SMTP acceptance server
        run: |
          node test/fake-smtp.mjs > /tmp/commender-smtp-server.log 2>&1 &
          echo $! > /tmp/commender-smtp-server.pid
          for i in {1..20}; do
            if grep -q "fake smtp listening" /tmp/commender-smtp-server.log 2>/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/commender-smtp-server.log
          exit 1
      - name: Start gateway
        run: |
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: Verify repeat migrations do not lock live business tables
        run: node test/migration-idempotence.mjs
      - name: Run integration acceptance
        run: npm run integration
      - name: Run OAuth 2.1 PKCE / ChatGPT MCP acceptance
        run: node test/oauth-integration.mjs
      - name: Command allowlist REST rules and approval e-mail notification
        run: node test/command-allowlist-api.mjs
      - name: Agent liveness (ping, stale close, offline state)
        run: node test/agent-liveness.mjs
      - name: RBAC matrix over MCP (viewer vs operator, audited denials)
        run: node test/rbac-matrix-e2e.mjs
      - name: Verify backup restore in disposable CI database
        working-directory: .
        run: bash scripts/ci-postgres-restore.sh
      - name: Run production acceptance probe against local gateway
        working-directory: .
        env:
          COMMANDER_BASE_URL: http://127.0.0.1:8787
        run: node scripts/accept-production.mjs
      - name: Verify search recovery across a real Gateway crash/restart
        run: node test/search-restart-e2e.mjs
      - name: Print gateway and SMTP logs on failure
        if: failure()
        run: |
          cat /tmp/commender-gateway.log || true
          cat /tmp/commender-smtp-server.log || true
          cat /tmp/commender-smtp.jsonl || true

  agent-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      HOST: 127.0.0.1
      PORT: 8787
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - name: Build opt-in debug Agent with deterministic MCP race fixture
        run: cargo build -p webrising-commender-agent --features ci-race-fixtures
      - name: Start gateway
        working-directory: gateway
        run: |
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: Run real-agent E2E
        run: node gateway/test/agent-e2e.mjs
      - name: Local stdio MCP mode (no gateway)
        run: node gateway/test/local-stdio-e2e.mjs
      - name: Verify real Rust Agent and Gateway SIGKILL/restart checkpoint handoff
        run: node gateway/test/native-restart-e2e.mjs
      - name: Verify real Rust Agent match-bearing content recovery after restart
        run: node gateway/test/native-restart-e2e.mjs content
      - name: Reject changed saved content during real Agent restart recovery
        run: node gateway/test/native-restart-e2e.mjs content-tampered
      - name: Device-local capabilities (read-only / no-commands) with a real Agent
        run: node gateway/test/device-capabilities-e2e.mjs
      - name: Restart gateway with MCP OAuth enabled
        working-directory: gateway
        env:
          MCP_OAUTH_ENABLED: "true"
        run: |
          kill "$(cat /tmp/commender-gateway.pid)" 2>/dev/null || true
          pkill -f "node dist/index.js" || true
          for i in {1..20}; do curl -fsS http://127.0.0.1:8787/health/live >/dev/null 2>&1 || break; sleep 0.5; done
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: MCP client acceptance (OAuth operator AI, admin approver, real Rust Agent)
        working-directory: gateway
        run: node test/mcp-client-acceptance.mjs
      - name: Print gateway log on failure
        if: failure()
        run: cat /tmp/commender-gateway.log || true

  relay-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      DEPLOYMENT_MODE: self_hosted
      REGIONAL_RELAY_ENABLED: true
      RELAY_CLUSTER_SECRET: ci-relay-cluster-secret-0123456789-0123456789
      RELAY_REQUEST_TIMEOUT_MS: 35000
      HOST: 127.0.0.1
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      PORT: 8787
      CLUSTER_NODE_ID: control-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - run: cargo build -p webrising-commender-agent
      - name: Start control and relay nodes
        working-directory: gateway
        run: |
          node dist/index.js > /tmp/commender-control.log 2>&1 &
          echo $! > /tmp/commender-control.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health >/dev/null || {
            cat /tmp/commender-control.log
            exit 1
          }

          PUBLIC_BASE_URL=http://127.0.0.1:8788 \
          PORT=8788 \
          CLUSTER_NODE_ID=relay-a \
          RELAY_REGION=eu-west \
          RELAY_PUBLIC_WS_URL=ws://127.0.0.1:8788/agent \
          RELAY_INTERNAL_BASE_URL=http://127.0.0.1:8788 \
          RELAY_MAX_DEVICES=10 \
          node dist/index.js > /tmp/commender-relay-a.log 2>&1 &
          echo $! > /tmp/commender-relay-a.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8788/health >/dev/null || {
            cat /tmp/commender-relay-a.log
            exit 1
          }

          PUBLIC_BASE_URL=http://127.0.0.1:8789 \
          PORT=8789 \
          CLUSTER_NODE_ID=relay-b \
          RELAY_REGION=eu-central \
          RELAY_PUBLIC_WS_URL=ws://127.0.0.1:8789/agent \
          RELAY_INTERNAL_BASE_URL=http://127.0.0.1:8789 \
          RELAY_MAX_DEVICES=10 \
          node dist/index.js > /tmp/commender-relay-b.log 2>&1 &
          echo $! > /tmp/commender-relay-b.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8789/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8789/health >/dev/null || {
            cat /tmp/commender-relay-b.log
            exit 1
          }
      - name: Run regional relay failover E2E
        run: node gateway/test/relay-e2e.mjs
      - name: Print cluster logs on failure
        if: failure()
        run: |
          echo "=== control ==="
          cat /tmp/commender-control.log || true
          echo "=== relay-a ==="
          cat /tmp/commender-relay-a.log || true
          echo "=== relay-b ==="
          cat /tmp/commender-relay-b.log || true
      - name: Stop cluster
        if: always()
        run: |
          for pidfile in /tmp/commender-control.pid /tmp/commender-relay-a.pid /tmp/commender-relay-b.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

  tls-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - name: Generate ephemeral localhost certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout /tmp/commender-tls.key \
            -out /tmp/commender-tls.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 600 /tmp/commender-tls.key
      - name: Verify TLS config fails closed
        working-directory: gateway
        run: |
          if TLS_CERT_FILE=/tmp/commender-tls.crt \
             PUBLIC_BASE_URL=https://localhost:9443 \
             node dist/index.js >/tmp/tls-pairing-check.log 2>&1; then
            echo "gateway accepted TLS_CERT_FILE without TLS_KEY_FILE" >&2
            exit 1
          fi
          grep -q "TLS_CERT_FILE and TLS_KEY_FILE must be configured together" /tmp/tls-pairing-check.log

          if TLS_CERT_FILE=/tmp/commender-tls.crt \
             TLS_KEY_FILE=/tmp/commender-tls.key \
             PUBLIC_BASE_URL=http://localhost:9443 \
             node dist/index.js >/tmp/tls-base-url-check.log 2>&1; then
            echo "gateway accepted HTTP PUBLIC_BASE_URL with native TLS" >&2
            exit 1
          fi
          grep -q "PUBLIC_BASE_URL must use https:// when native TLS is enabled" /tmp/tls-base-url-check.log

          if PUBLIC_BASE_URL=https://localhost:9443/subpath              node dist/index.js >/tmp/public-origin-check.log 2>&1; then
            echo "gateway accepted PUBLIC_BASE_URL with a path" >&2
            exit 1
          fi
          grep -q "PUBLIC_BASE_URL must be an http(s) origin" /tmp/public-origin-check.log
      - name: Start native HTTPS gateway
        working-directory: gateway
        run: |
          HOST=127.0.0.1 \
          PORT=9443 \
          PUBLIC_BASE_URL=https://localhost:9443 \
          TLS_CERT_FILE=/tmp/commender-tls.crt \
          TLS_KEY_FILE=/tmp/commender-tls.key \
          TLS_MIN_VERSION=TLSv1.2 \
          node dist/index.js > /tmp/commender-tls-gateway.log 2>&1 &
          echo $! > /tmp/commender-tls-gateway.pid

          for i in {1..30}; do
            if curl --cacert /tmp/commender-tls.crt -fsS https://localhost:9443/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-tls-gateway.log
          exit 1
      - name: Run HTTPS and WSS acceptance
        env:
          TEST_TLS_BASE_URL: https://localhost:9443
          TEST_TLS_CA_FILE: /tmp/commender-tls.crt
        run: node gateway/test/tls-smoke.mjs
      - name: Print TLS gateway log on failure
        if: failure()
        run: cat /tmp/commender-tls-gateway.log || true
      - name: Stop TLS gateway
        if: always()
        run: |
          if [ -f /tmp/commender-tls-gateway.pid ]; then
            kill "$(cat /tmp/commender-tls-gateway.pid)" 2>/dev/null || true
          fi

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-postgres-password
      CONTROL_API_KEY: ci-compose-control-key-012345678901234567890
      APPROVAL_SIGNING_SECRET: ci-compose-approval-secret-0123456789012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose models
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.coolify.yml config --quiet
      - name: Start clean stack
        run: docker compose up -d --build --wait
      - name: Verify gateway health and console
        run: |
          curl -fsS http://127.0.0.1:8787/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8787/ | grep -q 'WECOMMANDER'
      - name: Verify backup and destructive restore
        run: |
          curl -fsS -X POST http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Backup Marker"}' >/dev/null

          rm -rf /tmp/commender-backups
          BACKUP_RETENTION_DAYS=0 bash scripts/backup-compose.sh /tmp/commender-backups
          archive="$(ls -1t /tmp/commender-backups/commender-*.dump | head -n1)"
          test -s "$archive"
          test -s "$archive.sha256"
          test -s "$archive.manifest"

          docker compose exec -T postgres psql -U commender -d commender -v ON_ERROR_STOP=1 \
            -c "delete from organizations where name='CI Backup Marker';" >/dev/null

          if curl -fsS http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" | grep -q 'CI Backup Marker'; then
            echo "marker deletion failed" >&2
            exit 1
          fi

          COMMANDER_RESTORE_CONFIRM=RESTORE bash scripts/restore-compose.sh "$archive"

          curl -fsS http://127.0.0.1:8787/api/organizations \
            -H "Authorization: Bearer $CONTROL_API_KEY" | grep -q 'CI Backup Marker'
      - name: Inspect containers on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true
      - name: Stop clean stack
        if: always()
        run: docker compose down -v --remove-orphans

  installer-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install-linux.sh
          bash -n scripts/setup-ubuntu.sh
          bash -n scripts/build-ubuntu-deb.sh
          bash -n scripts/wecommander-setup-wrapper.sh
          bash -n scripts/install-ubuntu-online.sh
          bash -n scripts/setup-macos.sh
          bash -n scripts/build-macos-pkg.sh
          bash -n scripts/install-macos-online.sh
          bash scripts/setup-ubuntu.sh --help >/dev/null
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/uninstall-macos.sh
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-windows.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/uninstall-windows.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }


  plan-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: V2 plan schedule and document consistency
        run: |
          python3 plans/tools/wecommander_v2_scheduler.py validate
          python3 plans/tools/wecommander_v2_scheduler.py check
          python3 -m unittest discover -s plans/tools -p 'test_*.py' -v

  linux-acceptance-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release agent
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release -p webrising-commender-agent
      - name: Package Linux acceptance bundle
        run: |
          mkdir -p dist
          cp target/release/webrising-commender dist/webrising-commender
          bash scripts/build-ubuntu-deb.sh target/release/webrising-commender "0.1.${GITHUB_RUN_NUMBER}" dist
          dpkg-deb --field "dist/wecommander-agent_0.1.${GITHUB_RUN_NUMBER}_amd64.deb" Package Version Architecture
          sudo apt-get install -y "./dist/wecommander-agent_0.1.${GITHUB_RUN_NUMBER}_amd64.deb"
          sudo wecommander-setup --help >/dev/null
          test -x /opt/wecommander/bin/webrising-commender
          test -x /usr/bin/wecommander-setup
          cp scripts/install-linux.sh dist/
          cp scripts/uninstall-linux.sh dist/
          cp scripts/setup-ubuntu.sh dist/
          cp docs/UBUNTU_INSTALL.md dist/
          cp docs/QUICKSTART.md dist/
          cd dist
          sha256sum webrising-commender wecommander-agent_*.deb > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-linux-x64-acceptance
          path: dist/*
          retention-days: 14


  windows-acceptance-artifact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release agent
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release -p webrising-commender-agent
      - name: Package Windows acceptance bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\webrising-commender.exe" "dist\webrising-commender.exe" -Force
          Copy-Item "docs\QUICKSTART.md" "dist\QUICKSTART.md" -Force
          Get-FileHash "dist\webrising-commender.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  webrising-commender.exe" } |
            Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
      - name: Build Windows graphical setup
        shell: pwsh
        run: |
          Copy-Item "installer\windows\WECOMMANDER.iss" "dist\WECOMMANDER.iss"
          Copy-Item "installer\windows\WECOMMANDER-Onboarding.ps1" "dist\WECOMMANDER-Onboarding.ps1"
          Copy-Item "installer\windows\Install-User-Agent.ps1" "dist\Install-User-Agent.ps1"
          Copy-Item "installer\windows\Run-User-Agent.ps1" "dist\Run-User-Agent.ps1"
          Copy-Item "installer\windows\Uninstall-User-Agent.ps1" "dist\Uninstall-User-Agent.ps1"
          Copy-Item "installer\windows\Migrate-Legacy-Service.ps1" "dist\Migrate-Legacy-Service.ps1"
          foreach ($script in @("dist\WECOMMANDER-Onboarding.ps1", "dist\Install-User-Agent.ps1", "dist\Run-User-Agent.ps1", "dist\Uninstall-User-Agent.ps1", "dist\Migrate-Legacy-Service.ps1")) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$null,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler missing: $compiler" }
          Push-Location dist
          try {
            & $compiler "/DAppVersion=0.1.0" "WECOMMANDER.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          } finally { Pop-Location }
          Copy-Item "dist\output\WECOMMANDER-Setup-windows-x64.exe" "dist\WECOMMANDER-Setup-windows-x64.exe"
          Get-FileHash "dist\WECOMMANDER-Setup-windows-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  WECOMMANDER-Setup-windows-x64.exe" } |
            Add-Content -Encoding ascii "dist\SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-windows-x64-acceptance
          path: dist/*
          retention-days: 14

  desktop:
    # V2 desktop app (desktop/): Tauri 2 with User and Agent workspaces, built
    # on Linux and Windows here and on macOS in macos.yml (G1). Separate cargo
    # workspace, like tray/.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          bash scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev openssh-server gnome-keyring dbus-x11
          # The OpenSSH interop test starts its own sshd on 127.0.0.1.
          sudo mkdir -p /run/sshd
      - name: Shared crates (format, lint, tests)
        shell: bash
        run: |
          cargo fmt -p wc-ssh-core -p wc-vault -p wc-app-core -p wc-core-service -- --check
          cargo clippy --locked -p wc-ssh-core -p wc-vault -p wc-app-core -p wc-core-service --all-targets -- -D warnings
          cargo test --locked -p wc-ssh-core -p wc-vault -p wc-app-core -p wc-core-service
      - name: G1 keyring smoke test (Linux Secret Service)
        if: runner.os == 'Linux'
        run: |
          cat > /tmp/keyring-smoke.sh <<'SH'
          set -e
          echo -n ci-keyring-password | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          cargo test --locked -p wc-vault --features os-keyring --lib -- --ignored
          SH
          dbus-run-session -- bash /tmp/keyring-smoke.sh
      - name: G1 keyring smoke test (Windows Credential Manager)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked -p wc-vault --features os-keyring --lib -- --ignored
      - name: Terminal view copy and UI syntax
        shell: bash
        run: |
          cmp packages/terminal-ui/src/index.js desktop/ui/terminal-view.js
          node --check desktop/ui/app.js
          node --check desktop/ui/terminal-view.js
      - name: Desktop app (format, lint, tests, release build)
        working-directory: desktop
        shell: bash
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Desktop installer (A04, unsigned)
        working-directory: desktop
        shell: bash
        env:
          BUNDLES: ${{ runner.os == 'Linux' && 'deb' || 'nsis' }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          npx -y @tauri-apps/cli@2.12.4 build --ci --bundles "$BUNDLES" --config "{\"version\":\"$VERSION\"}"
          mkdir -p dist
          if [ "$BUNDLES" = deb ]; then
            cp target/release/bundle/deb/*.deb dist/WECOMMANDER-Desktop-linux-amd64.deb
          else
            cp target/release/bundle/nsis/*-setup.exe dist/WECOMMANDER-Desktop-windows-x64-setup.exe
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Desktop-${{ runner.os }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  center-windows:
    # Management Center (tray app). Separate cargo workspace in tray/.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --locked
      - name: Build release tray app
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\wecommander-center.exe" "dist\WECOMMANDER-Center-windows-x64.exe"
          $size = (Get-Item "dist\WECOMMANDER-Center-windows-x64.exe").Length
          if ($size -lt 1MB) { throw "tray app binary is unexpectedly small: $size bytes" }
      - name: Center installer dry run on Windows PowerShell 5.1
        shell: powershell
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install-center-windows-online.ps1'),[ref]$null,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          # Before the first release with the tray app there is nothing to pick;
          # the script must say so cleanly instead of failing to parse releases.
          # Its "not yet" error arrives on stderr; the step shell would stop on it.
          $ErrorActionPreference = 'Continue'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-center-windows-online.ps1 -DryRun -Tauri 2>&1 | Out-String
          $ErrorActionPreference = 'Stop'
          Write-Host $out
          if ($out -notmatch 'would install ubuntu-preview-[0-9]+ from https://github.com/orhanbal/webrising-commender/releases/download/ubuntu-preview-[0-9]+/WECOMMANDER-Center-windows-x64.exe' -and
              $out -notmatch 'No preview release with the Management Center yet') {
            throw 'center installer dry run did not resolve a release'
          }
          # The "not yet" answer exits 1 by design; the match above is the check.
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Center-windows-x64
          path: tray/dist/WECOMMANDER-Center-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  center-linux:
    # Management Center for Linux desktops: the Tauri tray app (tray/) with
    # freedesktop notifications that carry Onayla / Reddet actions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install WebKitGTK and tray libraries
        timeout-minutes: 30
        run: bash scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format, lint and unit tests
        working-directory: tray
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build release tray app
        working-directory: tray
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release --locked
      - name: Build the agent the app carries and runs itself
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release --locked -p webrising-commender-agent
      - name: Package
        run: bash scripts/build-center-linux.sh "0.1.${{ github.run_number }}" tray/dist
      - name: Install and start from the package (headless desktop session)
        run: |
          sudo apt-get install -y xvfb dbus-x11
          sh -n scripts/install-center-macos-online.sh
          cmp scripts/install-center-macos-online.sh gateway/public/install/center-macos.sh
          mkdir -p /tmp/center-home && tar -xzf tray/dist/WECOMMANDER-Center-linux-x86_64.tar.gz -C /tmp/center-home
          test -x /tmp/center-home/wecommander-center/wecommander-center
          /tmp/center-home/wecommander-center/webrising-commender --version | grep -q "0.1.${{ github.run_number }}$"
          grep -q '^Exec=wecommander-center$' /tmp/center-home/wecommander-center/wecommander-center.desktop
          # The app must start and keep running under a real X display and
          # session bus (tray, webview, notification plugin) for a few seconds.
          export HOME=/tmp/center-home
          dbus-run-session -- xvfb-run -a sh -c '/tmp/center-home/wecommander-center/wecommander-center --hidden & pid=$!; sleep 8; kill -0 $pid; kill $pid'
      - name: Center installer dry run on Linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$(sh scripts/install-center-macos-online.sh --dry-run 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -E "would install (center-linux-latest|ubuntu-preview-[0-9]+)|No preview release with the Management Center for this system yet"
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Center-linux-x86_64
          path: tray/dist/WECOMMANDER-Center-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  center-winui:
    # Management Center for Windows: native WinUI 3 app (center-windows/).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wecommander-core (shared Rust app core)
        run: cargo build --locked --release -p wc-core-service
      - name: Build the agent the app carries and runs itself
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --locked --release -p webrising-commender-agent
      - name: Core unit tests (CoreClient against the real wecommander-core)
        env:
          WECOMMANDER_CORE_BIN: ${{ github.workspace }}\target\release\wecommander-core.exe
        run: dotnet test center-windows/Core.Tests/WecommanderCenter.Core.Tests.csproj
      - name: Publish self-contained WinUI app
        run: |
          dotnet publish center-windows/App/WecommanderCenter.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o center-windows/publish
          Copy-Item target\release\wecommander-core.exe center-windows\publish\wecommander-core.exe
          Copy-Item target\release\webrising-commender.exe center-windows\publish\webrising-commender.exe
          # The app compares this build with the newest release for in-app updates.
          Set-Content -Path center-windows\publish\build.txt -Value "${{ github.run_number }}" -NoNewline -Encoding ascii
      - name: Smoke test (the main window opens; every section and + work)
        shell: powershell
        run: |
          # Smoke test: the main window opens and shows its sections (an empty
          # window got through once). UI Automation reads the real WinUI tree.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'smoke-localappdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $env:WECOMMANDER_DEBUG_LAYOUT = '1'
          $app = Start-Process -FilePath "center-windows\publish\WecommanderCenter.exe" -ArgumentList '--open-main' -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $found = @()
          for ($i = 0; $i -lt 40 -and $found.Count -lt 2; $i++) {
            Start-Sleep -Milliseconds 750
            $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children,
              (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)))
            foreach ($window in $windows) {
              $names = @('Sunucular', 'Yeni sunucu' | Where-Object {
                $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                  (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $_))) })
              if ($names.Count -gt $found.Count) { $found = $names }
            }
          }
          if ($found.Count -lt 2) {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            throw "Main window did not show its sections (found: $($found -join ', '))"
          }
          Write-Host "Main window shows: $($found -join ', ')"
          # Walk every section and press the terminal tab strip's "+": an error
          # there must never reach users (it once did).
          # Found AND drawn: a collapsed page still has its elements in the
          # automation tree, only off-screen with an empty rectangle.
          function Find-Visible($name) {
            $e = Find-ByName $name
            if (-not $e) { return $null }
            $r = $e.Current.BoundingRectangle
            if ($e.Current.IsOffscreen -or $r.IsEmpty -or $r.Width -le 0 -or $r.Height -le 0) { return $null }
            return $e
          }
          function Find-ByName($name) {
            $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children,
              (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)))
            foreach ($w in $windows) {
              $e = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)))
              if ($e) { return $e }
            }
            return $null
          }
          function Press($element) {
            $p = $null
            if ($element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$p)) { $p.Invoke(); return }
            if ($element.TryGetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern, [ref]$p)) { $p.Select(); return }
            throw "cannot press $($element.Current.Name)"
          }
          # Windows PowerShell reads this script as ANSI: Turkish letters are spelled as code points.
          $c = [char]0x00E7; $i = [char]0x0131; $u = [char]0x00FC; $s = [char]0x015F
          foreach ($section in @('Terminaller', 'Sunucular', 'Anahtarlar', 'Kimlikler', "Par${c}ac${i}klar", "T${u}neller", 'Bilinen sunucular', "Ge${c}mi${s}", 'Ayarlar', 'Terminaller', 'Sunucular', 'Terminaller')) {
            $item = Find-ByName $section
            if (-not $item) { throw "menu item missing: $section" }
            Press $item
            Start-Sleep -Milliseconds 900
            if ($app.HasExited) { throw "the app closed after opening $section" }
            # Diagnostics: is this section's own content drawn?
            $probe = @{ 'Terminaller' = "A${c}${i}k terminal yok"; 'Sunucular' = 'Yeni sunucu'; 'Anahtarlar' = 'Yeni anahtar' }[$section]
            if ($probe) {
              $e = Find-ByName $probe
              if ($e) { Write-Host ("{0}: '{1}' offscreen={2} rect={3}" -f $section, $probe, $e.Current.IsOffscreen, $e.Current.BoundingRectangle) }
              else { Write-Host ("{0}: '{1}' not in the tree" -f $section, $probe) }
            }
            if ($section -eq 'Sunucular' -and -not (Find-Visible 'Yeni sunucu')) {
              Start-Sleep -Milliseconds 800
              $layout = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\layout.log'
              if (Test-Path $layout) { Write-Host '--- layout.log ---'; Get-Content $layout | ForEach-Object { Write-Host $_ } } else { Write-Host 'no layout.log' }
              throw "Sunucular opened blank (its page is not on screen)"
            }
          }
          $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children,
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)))
          $add = $null
          foreach ($w in $windows) {
            $add = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
              (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'AddButton')))
            if ($add) { break }
          }
          if (-not $add) { throw "the terminal tab strip's + button is missing" }
          Press $add
          Start-Sleep -Milliseconds 1500
          if ($app.HasExited) { throw "the app closed after pressing +" }
          if (-not (Find-Visible 'Yeni sunucu')) { throw "+ did not open the server list (not on screen)" }
          $logs = @((Join-Path $env:LOCALAPPDATA 'WECOMMANDER\errors.log'),
                    (Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\errors.log'))
          foreach ($log in $logs) {
            if (Test-Path $log) { Get-Content $log; throw "the app logged an error while walking its sections" }
          }
          Write-Host "Every section opened; + opened the server list; no errors logged"
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process -Name 'wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # A terminal tab is laid out: its terminal view gets the page's size
          # (a tab once opened with an empty, zero-size terminal).
          Start-Sleep -Seconds 2
          $layout = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WECOMMANDER\layout.log'
          Remove-Item $layout -ErrorAction SilentlyContinue
          $env:WECOMMANDER_DEBUG_TAB = '1'
          $app = Start-Process -FilePath "center-windows\publish\WecommanderCenter.exe" -ArgumentList '--open-main' -PassThru
          $sized = $false
          for ($i = 0; $i -lt 40 -and -not $sized; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $layout) { $sized = [bool](Select-String -Path $layout -Pattern 'webview: size=([1-9][0-9]+)x([1-9][0-9]+)' -Quiet) }
          }
          if (Test-Path $layout) { Write-Host '--- layout.log ---'; Get-Content $layout | ForEach-Object { Write-Host $_ } } else { Write-Host 'no layout.log' }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process -Name 'wecommander-core','webrising-commender' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $sized) { throw "a terminal tab opened with a zero-size terminal" }
          Write-Host "A terminal tab gets its full size"
      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path "center-windows\publish\WecommanderCenter.exe")) { throw "WecommanderCenter.exe missing from publish output" }
          if (-not (Test-Path "center-windows\publish\wecommander-core.exe")) { throw "wecommander-core.exe missing from publish output" }
          if (-not (Test-Path "center-windows\publish\webrising-commender.exe")) { throw "embedded agent missing from publish output" }
          $agentVersion = (& "center-windows\publish\webrising-commender.exe" --version) -join ' '
          if ($agentVersion -notmatch "0\.1\.${{ github.run_number }}$") { throw "embedded agent has the wrong version: $agentVersion" }
          if ((Get-Content center-windows\publish\build.txt -Raw).Trim() -ne "${{ github.run_number }}") { throw "build.txt missing or wrong" }
          if (-not (Test-Path "center-windows\publish\Assets\terminal\index.html")) { throw "terminal surface missing from publish output" }
          foreach ($asset in @("icon.ico","icon.png","tray.ico","tray-pending.ico","tray-autonomy.ico","tray-autonomy-pending.ico","wordmark-dark-text.png","wordmark-light-text.png")) {
            if (-not (Test-Path "center-windows\publish\Assets\$asset")) { throw "asset missing: $asset" }
          }
          Compress-Archive -Path "center-windows\publish\*" -DestinationPath "center-windows\WECOMMANDER-Center-windows-x64.zip"
          $size = (Get-Item "center-windows\WECOMMANDER-Center-windows-x64.zip").Length
          Write-Host "zip size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 10MB) { throw "WinUI package is unexpectedly small: $size bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Center-WinUI-windows-x64
          path: center-windows/WECOMMANDER-Center-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  center-windows-store:
    # Microsoft Store copy of the Windows app (MSIX, UnmadeThings.WECOMMANDER).
    # Unsigned: Partner Center signs what is uploaded there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wecommander-core and the agent the app carries
        env:
          WECOMMANDER_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --locked --release -p wc-core-service -p webrising-commender-agent
      - name: Build the Store package
        shell: pwsh
        run: |
          $payload = "center-windows\StorePayload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item target\release\wecommander-core.exe "$payload\wecommander-core.exe"
          Copy-Item target\release\webrising-commender.exe "$payload\webrising-commender.exe"
          Set-Content -Path "$payload\build.txt" -Value "${{ github.run_number }}" -NoNewline -Encoding ascii
          # Store versions: 0.1.<build>.0 (the last part must be 0).
          $manifest = "center-windows\App\Package.appxmanifest"
          (Get-Content $manifest -Raw) -replace 'Version="0\.1\.0\.0"', 'Version="0.1.${{ github.run_number }}.0"' | Set-Content $manifest -Encoding utf8
          $out = Join-Path $PWD "center-windows\AppPackages\"
          dotnet publish center-windows/App/WecommanderCenter.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 `
            -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Never -p:AppxPackageDir=$out
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed" }
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
      - name: Check the package
        shell: pwsh
        run: |
          $msix = Get-ChildItem center-windows\AppPackages -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "no .msix produced" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $names = $zip.Entries | ForEach-Object { $_.FullName }
          $manifest = (New-Object System.IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())).ReadToEnd()
          $zip.Dispose()
          foreach ($f in @('WecommanderCenter.exe','wecommander-core.exe','webrising-commender.exe','build.txt','resources.pri','Assets/terminal/index.html','Assets/monitor/ghost.png','Assets/Store/Square44x44Logo.png')) {
            if ($names -notcontains $f) { throw "missing from the package: $f" }
          }
          if ($manifest -notmatch 'Name="UnmadeThings.WECOMMANDER"') { throw "wrong package name" }
          if ($manifest -notmatch 'Publisher="CN=60C5C646-086F-4B8B-BF4A-E5099CC37CA7"') { throw "wrong publisher" }
          if ($manifest -notmatch 'Version="0\.1\.${{ github.run_number }}\.0"') { throw "wrong version" }
          if ($manifest -notmatch 'windows.startupTask') { throw "startup task missing" }
          Write-Host "MSIX ok: $($msix.Name) $([math]::Round($msix.Length / 1MB, 1)) MB"
          # Partner Center takes the .msix as it is and signs it.
          New-Item -ItemType Directory -Force -Path store-dist | Out-Null
          Copy-Item $msix.FullName "store-dist\WECOMMANDER-Store-x64.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: WECOMMANDER-Store-x64
          path: store-dist/WECOMMANDER-Store-x64.msix
          if-no-files-found: error
          retention-days: 30

  windows-service-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native agent
        run: cargo build -p webrising-commender-agent
      - name: Install, start and remove Windows service
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramData "WebRisingCommenderCI"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $binary = Join-Path $dir "webrising-commender.exe"
          $config = Join-Path $dir "agent.json"
          Copy-Item "target\debug\webrising-commender.exe" $binary -Force

          $keyBytes = [byte[]](1..32 | ForEach-Object { 7 })
          $approvalKey = [Convert]::ToBase64String($keyBytes).TrimEnd("=").Replace("+","-").Replace("/","_")

          @{
            deviceId = "00000000-0000-0000-0000-000000000001"
            deviceToken = "ci-device-token"
            approvalKey = $approvalKey
            gatewayWsUrl = "ws://127.0.0.1:9/agent"
            controlUrl = "http://127.0.0.1:9"
            name = "CI Windows Service"
            allowedRoots = @($dir)
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $config

          try {
            .\scripts\install-windows.ps1 -BinaryPath $binary -ConfigPath $config -AllowLocalSystem
            Start-Sleep -Seconds 3
            $service = Get-Service -Name "WebRisingCommender"
            if ($service.Status -ne "Running") {
              throw "Expected service to be Running, got $($service.Status)"
            }
          }
          finally {
            .\scripts\uninstall-windows.ps1 -ServiceName "WebRisingCommender"
            Start-Sleep -Seconds 2
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          }
      - name: Register passwordless Windows user agent task
        shell: pwsh
        run: |
          # This tests registration and the least-privilege interactive principal.
          # CI runners might have no desktop login, so activation is validated
          # by real Windows acceptance rather than launching the hidden agent.
          $dir = Join-Path $env:TEMP 'WECOMMANDER-UserTask-CI'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $binary = Join-Path $dir 'webrising-commender.exe'
          $config = Join-Path $dir 'agent.json'
          Copy-Item 'target\debug\webrising-commender.exe' $binary -Force
          @{
            deviceId = '00000000-0000-0000-0000-000000000002'
            deviceToken = 'ci-device-token'
            approvalKey = 'BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc'
            gatewayWsUrl = 'ws://127.0.0.1:9/agent'
            controlUrl = 'http://127.0.0.1:9'
            name = 'CI user-mode task'
            allowedRoots = @($dir)
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $config
          try {
            .\installer\windows\Install-User-Agent.ps1 -BinaryPath $binary -ConfigPath $config -SkipStart
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
            $taskName = "WECOMMANDER-Agent-$($identity.User.Value)"
            $task = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
            if ($task.Principal.LogonType -ne 'Interactive' -or $task.Principal.RunLevel -ne 'Limited') {
              throw "Unexpected user-task principal: $($task.Principal.LogonType) / $($task.Principal.RunLevel)"
            }
            # Started through a headless console host (no Windows Terminal window).
          $launch = "$($task.Actions.Execute) $($task.Actions.Arguments)"
          if ($launch -notmatch 'powershell.exe' -or $launch -notmatch 'Run-User-Agent.ps1') { throw 'Agent launcher not configured.' }
          if ((Test-Path "$env:SystemRoot\System32\conhost.exe") -and ($task.Actions.Execute -notmatch 'conhost.exe' -or $task.Actions.Arguments -notmatch '--headless')) { throw 'Agent must start without a window (conhost --headless).' }
          } finally {
            .\installer\windows\Uninstall-User-Agent.ps1
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          }
