name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p webrising-commender-agent

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: gateway
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      HOST: 127.0.0.1
      PORT: 8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start gateway
        run: |
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: Run integration acceptance
        run: npm run integration
      - name: Print gateway log on failure
        if: failure()
        run: cat /tmp/commender-gateway.log || true

  agent-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commender
          POSTGRES_USER: commender
          POSTGRES_PASSWORD: commender-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commender -d commender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commender:commender-test@127.0.0.1:5432/commender
      CONTROL_API_KEY: ci-control-key-0123456789-0123456789
      APPROVAL_SIGNING_SECRET: ci-approval-secret-0123456789-012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      HOST: 127.0.0.1
      PORT: 8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - run: cargo build -p webrising-commender-agent
      - name: Start gateway
        working-directory: gateway
        run: |
          node dist/index.js > /tmp/commender-gateway.log 2>&1 &
          echo $! > /tmp/commender-gateway.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/commender-gateway.log
          exit 1
      - name: Run real-agent E2E
        run: node gateway/test/agent-e2e.mjs
      - name: Print gateway log on failure
        if: failure()
        run: cat /tmp/commender-gateway.log || true

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-postgres-password
      CONTROL_API_KEY: ci-compose-control-key-012345678901234567890
      APPROVAL_SIGNING_SECRET: ci-compose-approval-secret-0123456789012345
      PUBLIC_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose model
        run: docker compose config --quiet
      - name: Start clean stack
        run: docker compose up -d --build --wait
      - name: Verify gateway health and console
        run: |
          curl -fsS http://127.0.0.1:8787/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8787/ | grep -q 'WebRising Commender'
      - name: Inspect containers on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true
      - name: Stop clean stack
        if: always()
        run: docker compose down -v --remove-orphans

  installer-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install-linux.sh
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/uninstall-macos.sh
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-windows.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/uninstall-windows.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
