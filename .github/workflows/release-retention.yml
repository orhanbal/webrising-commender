name: release-retention
# Keeps GitHub Releases small: only the newest preview releases per channel
# stay. The apps update from the newest `ubuntu-preview-N` / `macos-preview-N`
# (they read the first 30 releases), the download page reads the first 40, and
# `center-linux-latest` / `macos-center-latest` are never touched. Release
# gates use workflow artifacts, not releases, so they are not affected.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      keep:
        description: "Newest releases to keep per channel"
        default: "10"
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-retention
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old preview releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep || '10' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          case "$KEEP" in ''|*[!0-9]*) echo "keep must be a number"; exit 1;; esac
          if [ "$KEEP" -lt 5 ]; then echo "keep must be at least 5"; exit 1; fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' > releases.tsv
          echo "releases: $(wc -l < releases.tsv)"
          : > delete.tsv
          for channel in ubuntu-preview macos-preview; do
            grep -P "\t${channel}-[0-9]+$" releases.tsv \
              | awk -F'\t' -v p="${channel}-" '{ n = substr($2, length(p) + 1); print n "\t" $1 "\t" $2 }' \
              | sort -t$'\t' -k1,1nr | tail -n +"$((KEEP + 1))" | cut -f2,3 >> delete.tsv || true
          done
          echo "to delete: $(wc -l < delete.tsv)"
          while IFS=$'\t' read -r id tag; do
            if [ "$DRY_RUN" = "true" ]; then echo "would delete $tag"; continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null && echo "deleted release $tag"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || echo "tag $tag already gone"
          done < delete.tsv
