services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commender
      POSTGRES_USER: commender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - commender-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commender -d commender"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgres://commender:${POSTGRES_PASSWORD}@postgres:5432/commender
      CONTROL_API_KEY: ${CONTROL_API_KEY:?CONTROL_API_KEY is required}
      APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?APPROVAL_SIGNING_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://wecommander.webrising.tr}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      TLS_CERT_FILE: ""
      TLS_KEY_FILE: ""
      TLS_MIN_VERSION: TLSv1.2
      TRUST_PROXY_HEADERS: "true"
      AGENT_REQUEST_TIMEOUT_MS: ${AGENT_REQUEST_TIMEOUT_MS:-30000}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      BROWSER_SESSION_HOURS: ${BROWSER_SESSION_HOURS:-12}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      REGIONAL_RELAY_ENABLED: ${REGIONAL_RELAY_ENABLED:-false}
      CLUSTER_NODE_ID: ${CLUSTER_NODE_ID:-}
      RELAY_CLUSTER_SECRET: ${RELAY_CLUSTER_SECRET:-}
      RELAY_REGION: ${RELAY_REGION:-default}
      RELAY_PUBLIC_WS_URL: ${RELAY_PUBLIC_WS_URL:-}
      RELAY_INTERNAL_BASE_URL: ${RELAY_INTERNAL_BASE_URL:-}
      RELAY_MAX_DEVICES: ${RELAY_MAX_DEVICES:-10000}
      RELAY_REQUEST_TIMEOUT_MS: ${RELAY_REQUEST_TIMEOUT_MS:-35000}
      RELAY_ALLOW_INSECURE_TRANSPORT: "false"
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      SIGNUP_VERIFY_TTL_HOURS: ${SIGNUP_VERIFY_TTL_HOURS:-24}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_ALLOW_INSECURE_TRANSPORT: "false"
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-wecommander.webrising.tr}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      MAIL_OUTBOX_KEY: ${MAIL_OUTBOX_KEY:-}
      MAIL_DELIVERY_INTERVAL_MS: ${MAIL_DELIVERY_INTERVAL_MS:-5000}
      MAIL_DELIVERY_BATCH: ${MAIL_DELIVERY_BATCH:-10}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-12}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('node:http');const req=http.get({host:'127.0.0.1',port:8787,path:'/health'},r=>process.exit(r.statusCode===200?0:1));req.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  commender-postgres:
