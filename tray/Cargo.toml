[package]
name = "wecommander-center"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WECOMMANDER Management Center: tray app for approvals and autonomous mode"
authors = ["Orhan Balci / WebRising"]

# Separate from the agent workspace: the tray app needs a webview toolkit
# (WebView2, WKWebView, WebKitGTK) that servers and the agent never need.
[workspace]

[[bin]]
name = "wecommander-center"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
url = "2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
