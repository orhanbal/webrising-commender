[package]
name = "wecommander-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WECOMMANDER desktop app: User Mode (SSH, SFTP) and Agent Mode workspaces (V2 A01 skeleton)"
authors = ["Orhan Balci / WebRising"]

# Separate workspace, like tray/: the desktop app needs a webview toolkit
# (WebView2, WKWebView, WebKitGTK) that servers and the agent never need.
[workspace]

[[bin]]
name = "wecommander-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wc-ssh-core = { path = "../crates/wc-ssh-core" }
wc-vault = { path = "../crates/wc-vault" }
